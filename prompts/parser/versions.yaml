# Parser prompt versions — the record that makes a prompt version IMMUTABLE.
#
# WHY A MANIFEST RATHER THAN A DIRECTORY LISTING. A prompt version that has been used is evidence:
# it produced a response somebody paid for and may act on. Editing the file in place would silently
# change what every past invocation claims to have been asked. The SHA-256 recorded here is what
# makes that impossible to do by accident — `packages/prompt_registry` refuses to load a version
# whose bytes have moved, and an architecture test fails the build for the same reason.
#
# A PROMPT CHANGE IS A NEW VERSION. Add a file, add an entry, leave the old one exactly as it is.
# Superseding is recorded with a forward note; nothing is rewritten.
#
# THE FILES ARE .txt AND NEVER .md. rules.md section 10, enforced by
# tests/architecture/test_architecture.py: model-visible prompt files must not be Markdown, and a
# prompt must never instruct a model to emit JSON, XML or Markdown.

schema_version: "prompt-versions-v1"

prompts:

  - prompt_id: parser-complete-filing
    version: "1"
    file: parser-complete-filing-v1.txt
    sha256: "3c7e8c3a0d909647856c1ee0ee140e347d4d3fbe35a6414bb81c7e094f703f7b"
    created: "2026-08-03"
    status: SUPERSEDED
    role: parsing
    supersedes: null
    superseded_by: "parser-complete-filing@2"
    note: >-
      The first provisional parser prompt. It asks for the complete filing in the filing's OWN
      vocabulary and deliberately imposes no section taxonomy: `type` and `title` are whatever the
      filing and the model produce, and rules.md section 21 rule 2 forbids a universal ontology
      without explicit user approval. The minimum envelope — artifact, document, nodes, unresolved,
      metadata — is provisional and is redesigned FROM what real models return, not before.

      Source references are verbatim QUOTES rather than byte offsets. A model cannot count bytes in
      an artifact it was handed as text, and a fabricated offset resolves to the wrong place while
      looking exactly like a real one. A quote either occurs in the preserved bytes or it does not,
      and the backend is what checks.

  - prompt_id: parser-complete-filing
    version: "2"
    file: parser-complete-filing-v2.txt
    sha256: "5e84ba57304c97fc36d661a1b74ed3e9ed0ab40d264fa74eec6f11487e25bc93"
    created: "2026-08-03"
    status: ACTIVE
    role: parsing
    supersedes: "parser-complete-filing@1"
    superseded_by: null
    note: >-
      CREATED FOR TWO OBJECTIVE FORMAT DEFECTS, WHICH IS THE ONLY REASON A NEW VERSION IS PERMITTED
      DURING A SHARED BENCHMARK. Both were observed in the version-1 pass, across five candidates
      and three filings, and neither is about the quality of any parse.

      FIRST, UNQUOTED SCALARS. One candidate returned a well-formed structure whose source quotes
      were unquoted YAML scalars containing the filing's own colons and SGML tags, so the document
      did not parse at all: "mapping values are not allowed here", on 3 of 3 filings. The parse was
      good; the serialisation was invalid, and an invalid document cannot be reviewed.

      SECOND, CODE FENCES. TWO candidates wrapped their YAML in a Markdown code fence on 3 of 3
      filings each, although version 1 already said "no code fence" in plain words. Six of the
      fifteen version-1 responses failed for this one reason. That is a MAJORITY behaviour across
      the candidate set rather than one model's quirk, which is what makes correcting it a format
      fix rather than tuning for a model.

      THIS FILE WAS AMENDED BEFORE IT WAS EVER USED, and that is the only circumstance in which a
      version file is touched after its hash is recorded. Version 2 had produced no response, cost
      nothing and appeared in no run record — it was a draft, not evidence. The immutability rule
      protects versions that produced responses somebody paid for, and version 1 is one of those:
      it is untouched, and every result it produced is preserved.

      THE SEMANTIC REQUEST IS UNCHANGED, DELIBERATELY. Version 2 adds a YAML quoting rule and
      nothing else — no new section vocabulary, no taxonomy, no per-model instruction, and no
      change to what completeness means. Tuning a prompt until each model looks successful is
      prompt tuning with the measurement removed; correcting a document that will not parse is
      not. Version 1 and every result it produced are preserved.

  # --- the MODEL-DIRECTED MULTIPART families, added by Phase 2.1 -----------------------------------
  #
  # THE TWO SINGLE-RESPONSE VERSIONS ABOVE ARE UNTOUCHED AND STAY THAT WAY. They are immutable
  # historical prompts: thirty preserved invocations quote them by hash, and every measured result
  # in docs/sprints/PHASE-0002 was produced by one of them. Nothing below supersedes either.
  # `parser-complete-filing@2` remains the ACTIVE prompt for the single-response `parsing` role.
  #
  # WHY THESE ARE SEPARATE ROLES RATHER THAN NEW VERSIONS OF THE SAME PROMPT. A version supersedes.
  # These do not: a multipart run and a single-response run are two protocols the user chooses
  # between, and the comparison in section 26 of the Phase 2.1 brief requires both to remain
  # runnable. `packages/prompt_registry.active_for` resolves ONE active prompt per role, so a
  # distinct role per family is what keeps six active prompts from being a configuration error.
  #
  # THE SEMANTIC REQUEST IS CARRIED OVER FROM parser-complete-filing@2 WHERE IT APPLIES. The node
  # contract, the source-reference contract, the use-the-filing's-own-names rule, the quoting rules
  # and the completeness standard are the same words. That is deliberate and it is what makes the
  # multipart-versus-single-response comparison honest: a multipart run that scored better because
  # it had been asked an easier question would measure the prompt, not the protocol.

  - prompt_id: parser-multipart-plan
    version: "1"
    file: parser-multipart-plan-v1.txt
    sha256: "134e6b485cac8259e596025d3b0673a3f5c7fa7fe5b701ceaf7a4090ed4289b7"
    created: "2026-08-03"
    status: SUPERSEDED
    role: parsing_multipart_plan
    supersedes: null
    superseded_by: "parser-multipart-plan@2"
    note: >-
      The first billable call of a multipart parse. It receives the complete intact filing and
      returns a COMPACT plan — a division of labour the model chooses for itself — and nothing
      else. It is told, in the synthetic brief the orchestrator compiles, the verified output limit
      of the call, the configured per-part target, the reserved response headroom and whether
      reasoning consumes the output allowance; those four numbers are measured facts about the
      call and are supplied per model rather than written into the prompt.

      IT IS FORBIDDEN TO RETURN CONTENT, and says so three times, because the failure mode is
      obvious: a planning call that starts parsing runs out of room and produces neither.

      THE BACKEND SUPPLIES NO PART NAMES. There is no list of sections here, no taxonomy, and no
      minimum or maximum part count. The plan's shape is the model's reading of the filing.

  - prompt_id: parser-multipart-part
    version: "1"
    file: parser-multipart-part-v1.txt
    sha256: "0171a2c6a6993e67598c9f1d6fceeca93a344764761e9f76dd9fc8f99dbd7efc"
    created: "2026-08-03"
    status: SUPERSEDED
    role: parsing_multipart_part
    supersedes: null
    superseded_by: "parser-multipart-part@2"
    note: >-
      One part of the model's own plan, produced completely, as ONE STANDALONE YAML DOCUMENT. The
      call receives the complete intact filing again — not a slice of it — plus the plan and the
      part specification the model itself wrote.

      "THIS CALL STANDS ALONE" IS A SECTION OF THE PROMPT AND IS THE POINT OF THE PROTOCOL. The
      model is told plainly that it is not continuing anything, that no previous response is in
      front of it, and that nothing it writes will be joined to another response. Phase 2.1
      prohibits blind continuation, and a prompt that left the model guessing whether it was
      resuming would produce exactly the half-documents that prohibition exists to prevent.

      PROACTIVE SUBPARTS. The model is asked to decide a part is too large BEFORE it starts
      writing, and told in plain words why: a response that stops mid-parse is thrown away, and a
      response that says how to divide the part is a plan.

  - prompt_id: parser-multipart-replan
    version: "1"
    file: parser-multipart-replan-v1.txt
    sha256: "2132e2ca91de209bbabbed2eb4fcbf2ce80b915bc6302ee929935f02f5044f82"
    created: "2026-08-03"
    status: SUPERSEDED
    role: parsing_multipart_replan
    supersedes: null
    superseded_by: "parser-multipart-replan@2"
    note: >-
      What runs INSTEAD OF a continuation when a part attempt stops at the output limit. It shows
      the model the exact truncated bytes as EVIDENCE, states in the prompt that they are not being
      continued and will not be joined to anything, and asks for subparts covering the WHOLE
      original part rather than only the remainder — because the truncated response is not going to
      be used as a parse, so dividing only the unreached half would leave the first half covered by
      nothing.

      THE MODEL'S CLAIM ABOUT WHAT IT COVERED IS RECORDED AND NOT BELIEVED. The prompt says so, and
      the backend enforces it: coverage comes from quotes that resolve in the preserved bytes.

  - prompt_id: parser-multipart-reconcile
    version: "1"
    file: parser-multipart-reconcile-v1.txt
    sha256: "3e9ac8226f704a7de9d77bf908e9c90bafb3299098f92ec4cbcbbb98b3df2e54"
    created: "2026-08-03"
    status: SUPERSEDED
    role: parsing_multipart_reconcile
    supersedes: null
    superseded_by: "parser-multipart-reconcile@2"
    note: >-
      A multipart parse is not complete because every planned part returned something. This call
      receives the complete intact filing and a COMPACT DETERMINISTIC INVENTORY of what was
      produced — identifiers, titles, declared statuses, node counts, resolved and unresolved
      reference counts, declared unresolved items, truncation — and asks whether the plan was
      actually carried out.

      IT MAY CREATE WORK. Additional and replacement parts become new tasks with new identifiers;
      an earlier result is never overwritten. Cycles are bounded, and the model is told which cycle
      it is in.

      THE PROMPT STATES THAT plan_complete IS A CLAIM AND NOT A VERDICT, and says why there is
      nothing to gain by overstating it. rules.md section 21 rule 5: a false complete is a defect.

  - prompt_id: parser-multipart-gap
    version: "1"
    file: parser-multipart-gap-v1.txt
    sha256: "f6810da11a3734b598545e88c3cd0cc3b7b64d7b0d27770e39d62b994315b5f3"
    created: "2026-08-03"
    status: SUPERSEDED
    role: parsing_multipart_gap
    supersedes: null
    superseded_by: "parser-multipart-gap@2"
    note: >-
      The backend reports MECHANICAL EVIDENCE and never names the missing semantic material. This
      prompt is where that boundary is written down for the model: the findings were produced by
      counting and searching, nothing that produced them knows what a filing contains, and a
      finding is therefore not an instruction.

      CONFIRMING A GAP IS AN ACCEPTED ANSWER, stated explicitly, because the alternative — a part
      invented to make a count balance — puts content into the parse that the filing does not
      contain.

  - prompt_id: parser-multipart-format-repair
    version: "1"
    file: parser-multipart-format-repair-v1.txt
    sha256: "c2fd5413eaf268e08816f8558c44144861b06e1b8b7f54fc3d1f547c519495b8"
    created: "2026-08-03"
    status: SUPERSEDED
    role: parsing_multipart_format_repair
    supersedes: null
    superseded_by: "parser-multipart-format-repair@2"
    note: >-
      SECTION 6 OF THE PHASE 2.1 BRIEF PERMITS THIS FAMILY "ONLY IF OBJECTIVELY REQUIRED", AND THE
      EVIDENCE IS IN THE PHASE 2 RECORD. Under prompt version 2, five of fifteen responses were
      UNPARSEABLE for serialisation reasons alone, and one candidate produced zero readable
      documents in six attempts while returning structures a reader could see were well formed. A
      response that is semantically useful and syntactically invalid is money already spent that
      cannot be reviewed.

      IT IS NARROW BY CONSTRUCTION. It receives the malformed response and the format rules, and
      NOT the filing — there is nothing to look up, because it is forbidden to change meaning. The
      prompt enumerates what must not change: no field added, none removed, no merge, no rename, no
      tidied title, no shortened quotation, no corrected spelling, no filled-in missing value.

      AT MOST ONE ATTEMPT PER ARTIFACT, and the original malformed response, the repair request,
      the repaired response and its validation are all preserved separately. The original is never
      replaced. It is never used to improve semantic quality, and an architecture test fails the
      build if a second attempt is ever configured.

  # --- the COMPLETENESS-AWARE, TABLE-AWARE families, added by Phase 2.2 ---------------------------
  #
  # THE SIX v1 MULTIPART FAMILIES ABOVE ARE NOW SUPERSEDED AND ARE UNTOUCHED. Seven preserved proof
  # runs and 286 provider attempts quote them by hash; every measured result in
  # docs/sprints/PHASE-0201 was produced by one of them, and every one of those results stays
  # attributable to the exact bytes that produced it. Superseding is recorded with a forward note;
  # nothing is rewritten. rules.md section 21 rule 16.
  #
  # THE SINGLE-RESPONSE FAMILY IS ALSO UNTOUCHED. `parser-complete-filing@2` remains the ACTIVE
  # prompt for the `parsing` role, so the single-response protocol stays runnable and the two
  # protocols can still be compared.
  #
  # WHY THESE ARE VERSIONS RATHER THAN NEW ROLES, WHICH IS THE OPPOSITE OF THE PHASE 2.1 CHOICE.
  # Phase 2.1 needed multipart and single-response to be runnable SIMULTANEOUSLY, so they had to be
  # separate roles — `active_for` resolves one active prompt per role. Phase 2.2 does not: the
  # completeness protocol REPLACES the Phase 2.1 multipart protocol for new runs, and a version is
  # exactly the right shape for a replacement whose predecessor's evidence must stay readable.
  #
  # THE SEMANTIC REQUEST IS CARRIED OVER FROM EACH v1 WORD FOR WORD WHERE IT STILL APPLIES. What is
  # added is a coverage-claim contract, a structured-table contract and an image contract. What is
  # NOT added is any vocabulary of sections, table types, units or period labels — rules.md section
  # 21 rule 2 forbids a universal filing taxonomy without explicit user approval, and a table schema
  # is the most tempting place in this entire system to build one.

  - prompt_id: parser-multipart-plan
    version: "2"
    file: parser-multipart-plan-v2.txt
    sha256: "840ebf0086733381b9c5f4b8174dc8d9a6aa631859b85ad461c266380caf731b"
    created: "2026-08-04"
    status: ACTIVE
    role: parsing_multipart_plan
    supersedes: "parser-multipart-plan@1"
    superseded_by: null
    note: >-
      THE PLAN NOW ACCOUNTS FOR A MECHANICAL INVENTORY IT DID NOT SEE IN VERSION 1. The brief
      supplies a list of table element identifiers and image identifiers measured from the
      preserved bytes, and the plan must say which part expects to account for each, and name
      anything it cannot yet assign. The backend still supplies NO part names, NO section
      vocabulary and NO minimum or maximum part count: an element identifier is a transport fact
      about where a `table` tag sits, not a claim that the table means anything.

      WHY THE INVENTORY IS SUPPLIED AT ALL. Phase 2.1 had no denominator. A parse could resolve
      352 of 364 of its own references and say nothing about what it never mentioned, because a
      region a model never cited never entered the count. Naming the elements up front is what
      makes an omission visible as an omission.

  - prompt_id: parser-multipart-part
    version: "2"
    file: parser-multipart-part-v2.txt
    sha256: "54e0c15d4bcb7fc174e0df04fd9b53cbc36dd322441e2e6c32a69a2733e459d3"
    created: "2026-08-04"
    status: ACTIVE
    role: parsing_multipart_part
    supersedes: "parser-multipart-part@1"
    superseded_by: null
    note: >-
      TWO ADDITIONS, AND BOTH EXIST BECAUSE PHASE 2.1 COULD NOT MEASURE WHAT IT NEEDED TO.

      COVERAGE CLAIMS. Every part now bounds the source regions it covered with a start quote and
      an end quote, both verbatim. Two resolved quotes bound an interval in the preserved bytes; a
      fabricated offset resolves to the wrong place while looking exactly like a real one, and a
      model handed a document as text cannot count characters in it. The union of every part's
      intervals, measured against the mechanical span inventory, is a coverage figure with a real
      denominator underneath it.

      STRUCTURED TABLES. `table_count` was ZERO in all seven Phase 2.1 proof runs, on both a 1996
      10-K405 and a 2025 10-Q/A, across five candidates. No prompt in that phase asked for one, so
      it measured unprompted behaviour rather than capability. This version asks, with a full cell
      contract and worked serialisation examples, and the answer to whether these models CAN
      preserve a table is the largest open question the previous proof left.

      THE SEMANTIC REQUEST IS OTHERWISE CARRIED OVER WORD FOR WORD. The node contract, the source
      reference contract, the use-the-filing's-own-names rule, the quoting rules, THIS CALL STANDS
      ALONE and IF THIS PART IS TOO LARGE are the same words as version 1. A v2 that scored
      differently because it asked an easier question would measure the prompt, not the protocol.

  - prompt_id: parser-multipart-replan
    version: "2"
    file: parser-multipart-replan-v2.txt
    sha256: "442b74b1c69a03e743ce8c6db1608b8aa8b51cb4974653b89901e6db420987b5"
    created: "2026-08-04"
    status: ACTIVE
    role: parsing_multipart_replan
    supersedes: "parser-multipart-replan@1"
    superseded_by: null
    note: >-
      Carries version 1's replanning contract unchanged — the truncated bytes are shown as
      EVIDENCE, they are explicitly not being continued, and the subparts must cover the WHOLE
      original part rather than the remainder — and adds the coverage-claim and structured-table
      contracts so a replanned subpart is measured on the same terms as any other part.

  - prompt_id: parser-multipart-reconcile
    version: "2"
    file: parser-multipart-reconcile-v2.txt
    sha256: "7f1f792c2d17b806b78286c5c21bf47ba51a4471ecc7890baa28ad676141b958"
    created: "2026-08-04"
    status: ACTIVE
    role: parsing_multipart_reconcile
    supersedes: "parser-multipart-reconcile@1"
    superseded_by: null
    note: >-
      THE INVENTORY IT IS SHOWN IS NOW THE CURRENT EFFECTIVE STATE. Version 1 was re-shown a
      superseded part's stale unresolved counts, because an earlier result is never overwritten, so
      the model kept re-reporting items whose replacements had already run. The counts now come
      from whichever artifact holds a part's content.

      It is additionally shown which table elements are still unaccounted for, which source regions
      no coverage claim reaches, and which images are unaccounted. Version 1's language is kept
      verbatim: these are MECHANICAL findings produced by counting and searching, nothing that
      produced them knows what a filing contains, and confirming that a finding is wrong is an
      accepted answer.

  - prompt_id: parser-multipart-gap
    version: "2"
    file: parser-multipart-gap-v2.txt
    sha256: "bd3d6bf5a5747efa73949d72f92b7c89ee9cc3c40355667535d2a9bd4a225d93"
    created: "2026-08-04"
    status: ACTIVE
    role: parsing_multipart_gap
    supersedes: "parser-multipart-gap@1"
    superseded_by: null
    note: >-
      Version 1's boundary is unchanged — the backend reports mechanical evidence and never names
      the missing semantic material — and the gap now carries a stable fingerprint so a repeated
      gap can be recognised as repeated. Confirming a gap does not exist remains an accepted
      answer, because the alternative is a part invented to make a count balance.

  - prompt_id: parser-multipart-format-repair
    version: "2"
    file: parser-multipart-format-repair-v2.txt
    sha256: "35ba683a7d76cececaa28854be1a22b74f670bc49a585a0e96a6f2e6f24bc491"
    created: "2026-08-04"
    status: ACTIVE
    role: parsing_multipart_format_repair
    supersedes: "parser-multipart-format-repair@1"
    superseded_by: null
    note: >-
      Version 1's narrowness is unchanged and is the whole point: it receives the malformed
      response and the format rules, NOT the filing, because there is nothing to look up and it is
      forbidden to change meaning. Version 2 extends the enumerated must-not-change list to cover
      the new structured-table and coverage-claim fields, so a repair cannot quietly invent a cell
      or an anchor while fixing a quoting error.

  - prompt_id: parser-multipart-table
    version: "1"
    file: parser-multipart-table-v1.txt
    sha256: "a5eedb3b49e999ad8f8cd2746549c06709db982a1dd8d3524bc9946d5f9df4bb"
    created: "2026-08-04"
    status: ACTIVE
    role: parsing_multipart_table
    supersedes: null
    superseded_by: null
    note: >-
      A NEW ROLE, NOT A NEW VERSION, BECAUSE IT SUPERSEDES NOTHING. It is the targeted call
      reconciliation makes when a data-bearing table element was not accounted for by any part: it
      receives the intact filing plus ONE mechanical table element and returns one structured table
      for it, a classification with source evidence, or an unresolved declaration.

      IT EXISTS SO A MISSING TABLE COSTS ONE CALL RATHER THAN A WHOLE PART. Re-requesting an entire
      part to recover one table would re-send the intact filing and re-emit everything else the
      part already produced, and on a filing this size that is the difference between a repair and
      a rerun.

  # --- the optional stages, added by Phase 3 -----------------------------------------------------
  #
  # THE DIRECTORY IS NAMED `parser` FOR HISTORICAL REASONS AND THE MANIFEST IS THE CONTRACT. The
  # registry has always keyed a prompt by its ROLE — `active_for(role)` predates these three — and
  # moving the parsing prompts to a new path would rewrite the recorded `file` of every version
  # that has already produced a billable response. The role field is what routes; the folder is a
  # location.
  #
  # ONE ACTIVE PROMPT PER ROLE, which `active_for` enforces by refusing two.

  - prompt_id: stage-summary
    version: "1"
    file: stage-summary-v1.txt
    sha256: "61e487f748e3d8b341cc50f81a3f869095a468f0d9fce60fff695049add782bf"
    created: "2026-08-05"
    status: ACTIVE
    role: summary
    supersedes: null
    superseded_by: null
    note: >-
      The first summary prompt. It summarises the NODES an accepted parse identified, one entry per
      node, and refuses to merge two into one or to drop one silently — rules.md section 3 makes
      every required node an independent summary target, so a summary stage that folded nodes
      together would break the completeness invariant from the other end.

      IT INVENTS NO NUMBER AND MAKES NO JUDGEMENT. A summary is level 5 in the source-of-truth
      hierarchy and is never evidence for a financial value; a stage that computed a total would
      manufacture one at a level that may not carry it.

  - prompt_id: stage-image
    version: "1"
    file: stage-image-v1.txt
    sha256: "275c405db28ae200853ee00909d61edbbca38931016ea777e3395e634a135cf6"
    created: "2026-08-05"
    status: ACTIVE
    role: image
    supersedes: null
    superseded_by: null
    note: >-
      The first image prompt. It receives the complete filed image set intact and describes each
      image, in filed order, one entry per image including the ones it cannot read.

      `carries_information: false` IS A FIRST-CLASS ANSWER. The image set of a real filing is
      mostly logos, rules and spacers, and a prompt that pushed for significance would produce it.

      IT READS AND NEVER INFERS: an unlabelled bar has no value known to the model, and a cut-off
      word is not completed.

  - prompt_id: stage-analysis
    version: "1"
    file: stage-analysis-v1.txt
    sha256: "1df374dc95b13b277b938cb1dba7256cfc2cda87870ea4f6d89b874bbb6dbbc3"
    created: "2026-08-05"
    status: ACTIVE
    role: analysis
    supersedes: null
    superseded_by: null
    note: >-
      The first analysis prompt, and it is deliberately the narrowest of the three. rules.md
      section 1 requires that Deep Analysis is scoped, and section 11 that it never escapes the
      corpus it was authorized for: this prompt is bound to ONE accession, refuses every question
      about anything else, and refuses every recommendation.

      EVERY MATERIAL CLAIM CARRIES A CITATION AND NO NUMBER IS DERIVED. rules.md section 2 puts an
      interpretation at level 6 and forbids it as evidence for a value, so a stage that computed a
      margin would produce a figure the hierarchy says it may not.
