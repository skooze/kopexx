name: ci

# Every validation command here is defined once, in the Makefile. CI invokes those targets rather
# than repeating them, so the local pre-commit suite and this workflow cannot drift apart.
# rules.md section 17 requires that reconciliation.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege. Neither job writes to the repository, opens issues, or publishes packages.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    # A live control plane. Without it the migration and DERA load tests SKIP, and a suite that
    # skips its only database tests reports green while proving nothing about the schema.
    #
    # DISPOSABLE CI-ONLY CREDENTIAL. The password below is a fixed, obviously non-production value
    # that exists for the lifetime of one Actions job. It is written here in the open deliberately:
    #
    #   - It protects nothing. The container is created and destroyed by this job, is reachable
    #     only from this job's network namespace, and holds four Apple filings' worth of public
    #     SEC data.
    #   - A repository secret would be worse, not better. It would imply the value is sensitive,
    #     add a rotation obligation for something that cannot leak anything, and make the workflow
    #     unreadable and unreproducible for a contributor.
    #   - `trust` was the previous setting. It accepts ANY connection with no password at all,
    #     which means the workflow never exercises the authentication path the application code
    #     takes, and it normalises a posture that must never reach a real deployment.
    #
    # It is not a pattern for any deployed database, and it says nothing about how one will
    # authenticate — that decision is still open. The local development host uses peer
    # authentication over a Unix socket and stores no password at all.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fintek
          POSTGRES_PASSWORD: ci-disposable-not-a-secret
          POSTGRES_DB: fintek
        ports:
          - 5432:5432
        # The health check authenticates rather than merely probing the port: PGPASSWORD makes
        # pg_isready complete a real connection, so the job waits for a server that will actually
        # accept the credential the tests use, not one that is merely listening.
        options: >-
          --health-cmd "PGPASSWORD=ci-disposable-not-a-secret pg_isready -U fintek -d fintek"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # TWO DATABASES ON ONE SERVER. The application database holds what the loader writes; the test
    # database is what the destructive migration round-trip drops and rebuilds. They must never be
    # the same, and tests/unit/test_database_isolation.py proves the pair is safe rather than
    # trusting these two lines.
    #
    # These URLs carry the disposable credential above. No step echoes them: `make` targets read
    # them from the environment, and the one command that reports on them —
    # `make db-verify-isolation` — prints only host, port, and database name, never the URL.
    env:
      DATABASE_URL: postgresql+psycopg://fintek:ci-disposable-not-a-secret@localhost:5432/fintek
      TEST_DATABASE_URL: postgresql+psycopg://fintek:ci-disposable-not-a-secret@localhost:5432/fintek_test

    # OFFICIAL ACTIONS ARE PINNED TO A REVIEWED MAJOR TAG, matching how every other dependency in
    # this repository is handled. The third-party scanner in the security job is stricter — a fixed
    # release plus a checksum — because it is not maintained by GitHub.
    #
    # checkout@v4 and setup-python@v5 both declare `runs.using: node20`, which GitHub has
    # deprecated; every run emitted a deprecation notice. Verified against the official
    # repositories: checkout is node24 from v5 onward and setup-python from v6 onward, and v7 is
    # the current major of both. Neither v7 change affects this workflow — checkout v7 restricts
    # fork checkouts under `pull_request_target`/`workflow_run`, which this workflow does not use,
    # and setup-python v7 removed a `pip-install` input this workflow never set.
    #
    # tests/architecture/test_ci_workflow.py parses this file and fails if a node20 major returns.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Explicit package discovery lives in pyproject.toml. Automatic flat-layout discovery
      # cannot work here: the repository root holds several non-Python top-level directories.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify the distribution imports
        run: python -c "import packages; print(packages.__file__)"

      - name: Format check
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      # The disposable database the destructive migration tests target. Created explicitly rather
      # than relying on the service container's POSTGRES_DB, which creates exactly one.
      - name: Create the disposable test database
        run: make db-create-test

      # The application schema the loader tests write against. Also the first proof in CI that the
      # migration applies to a real server, which offline DDL generation cannot establish.
      - name: Apply migrations
        run: make db-upgrade

      # Fails the job if DATABASE_URL and TEST_DATABASE_URL resolve to the same database, before
      # any test has a chance to drop anything. Compares parsed host, port, socket, and database
      # name — not the configured strings, which can spell one database two ways.
      - name: Prove the destructive target is not the application database
        run: make db-verify-isolation

      - name: Unit tests
        run: make test-unit

      - name: Integration tests
        run: make test-integration

      # ANTI-VACUITY GATE. A database is running, so the tests that require one must RUN. If any
      # test skips here, the reason is printed and the job fails, because a skip in this
      # environment means a guard silently stopped being enforced.
      #
      # The same run also enforces the application-preservation gate in tests/conftest.py: the
      # suite must leave the application database's issuer, filing, and xbrl_fact counts exactly
      # as it found them, whether the change came from a dropped table or a stray fixture row.
      - name: Database tests must not skip, and application data must survive
        run: make test-no-skips

      # Exact counts on one line. "330 passed" is what a reviewer needs, and finding it should not
      # require expanding a step and scrolling past a screen of progress dots.
      - name: Report test totals
        if: always()
        run: make test-summary

      # Enforces the structural invariants in rules.md, including the LLM content boundary:
      # no provider SDK outside the provider adapter, no Markdown prompt files, no prompt
      # instructing a model to emit a prohibited format, and no empty package stubs.
      - name: Architecture tests
        run: make test-architecture

      # Offline DDL generation across the full revision range, base to head and head to base.
      # Needs no database. The range is derived from the head revision, so a new migration is
      # covered without editing anything here or in the Makefile.
      - name: Migration reversibility
        run: make migration-check

      - name: Coverage
        run: make coverage

  security:
    runs-on: ubuntu-latest
    env:
      # Pinned release, verified by checksum below. A moving tag would let the scanner change
      # under us without review.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      # SECURITY-INVARIANT: fetch-depth 0. A shallow clone cannot be scanned for secrets in
      # history, and the first CI run checked out with depth 1.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # Scans ALL REACHABLE COMMITS via --log-opts "--all --full-history", not the push event's
      # commit range. The previous configuration used that range, which on a first push resolved
      # to the nonexistent parent of the root commit; gitleaks errored having scanned ~0 bytes
      # and the job failed without ever inspecting the repository.
      #
      # --redact keeps any finding out of the log. --exit-code 1 makes a finding fail the job.
      - name: Secret scan - full git history
        run: |
          set -euo pipefail
          ./gitleaks git . \
            --log-opts="--all --full-history" \
            --redact \
            --no-banner \
            --exit-code 1

      # Second pass over the checked-out working tree. History and tree can differ, and a
      # tracked file is what an attacker actually reads.
      - name: Secret scan - working tree
        run: |
          set -euo pipefail
          ./gitleaks dir . \
            --redact \
            --no-banner \
            --exit-code 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Enforcing, not advisory. The previous `|| true` existed because `--strict` errors on
      # fintek itself, which is an editable local install and not on PyPI. --skip-editable is
      # the correct exclusion, so the gate can now fail the job on a real advisory instead of
      # swallowing every result. Verified: exits 0 on the current dependency set, and exits 1
      # against a deliberately vulnerable pin.
      - name: Dependency vulnerability scan
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip pip-audit
          pip-audit --skip-editable
