name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Format check
        run: ruff format --check packages tests

      - name: Lint
        run: ruff check packages tests

      - name: Type check
        run: mypy packages --ignore-missing-imports

      - name: Unit tests
        run: pytest tests/unit -q

      - name: Integration tests
        run: pytest tests/integration -q

      # Enforces the structural invariants in rules.md, including the LLM content boundary:
      # no provider SDK outside the provider adapter, no Markdown prompt files, and no prompt
      # instructing a model to emit a prohibited format.
      - name: Architecture tests
        run: pytest tests/architecture -q

      - name: Coverage
        run: |
          pytest tests -q \
            --cov=packages.sec_identity --cov=packages.configuration \
            --cov=packages.sec_client --cov=packages.storage \
            --cov=packages.llm_gateway --cov=packages.dera_notes \
            --cov=packages.observability \
            --cov-report=term --cov-fail-under=85

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependency vulnerability scan
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --strict || true   # advisory until the dependency set stabilises
