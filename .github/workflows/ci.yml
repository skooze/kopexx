name: ci

# Every validation command here is defined once, in the Makefile. CI invokes those targets rather
# than repeating them, so the local pre-commit suite and this workflow cannot drift apart.
# rules.md section 17 requires that reconciliation.
#
# NO DATABASE SERVICE, AND THAT IS NOT A RELAXATION. This job used to run a postgres:18 service
# container, create two disposable databases, prove their identities distinct, apply Alembic
# migrations, and run a zero-skip gate whose whole purpose was to catch database tests skipping
# for want of a server. The application persistence layer, its ORM, its migrations and every test
# that touched a database are deleted — there is no schema left to migrate and no destructive test
# left to isolate. The zero-skip gate SURVIVES and is now stronger: with no environmental
# precondition anywhere in the suite, a skip in this job has no legitimate cause at all.
#
# NO AWS. No `id-token` permission, no credential configuration, no provider SDK. Nothing in this
# repository has ever reached a model, and ordinary CI must not be the thing that changes that.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege. Neither job writes to the repository, opens issues, or publishes packages.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    # OFFICIAL ACTIONS ARE PINNED TO A REVIEWED MAJOR TAG, matching how every other dependency in
    # this repository is handled. The third-party scanner in the security job is stricter — a fixed
    # release plus a checksum — because it is not maintained by GitHub.
    #
    # checkout@v4 and setup-python@v5 both declare `runs.using: node20`, which GitHub has
    # deprecated; every run emitted a deprecation notice. v7 is the current major of both.
    # tests/architecture/test_ci_workflow.py parses this file and fails if a node20 major returns.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Explicit package discovery lives in pyproject.toml. Automatic flat-layout discovery
      # cannot work here: the repository root holds several non-Python top-level directories.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify the distribution imports
        run: python -c "import packages; print(packages.__file__)"

      # THE DELETED TREES MUST NOT COME BACK THROUGH THE DISTRIBUTION. Importing them has to fail,
      # and a failure to fail is a silent reintroduction of the rejected architecture.
      - name: Verify the deleted packages are gone
        run: |
          set -euo pipefail
          for module in footnote_extractor footnote_canonicalizer table_parser persistence dera_notes; do
            if python -c "import packages.$module" 2>/dev/null; then
              echo "packages.$module still imports; it was deleted and must not return" >&2
              exit 1
            fi
            echo "packages.$module correctly absent"
          done

      - name: Format check
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Unit tests
        run: make test-unit

      # Enforces the structural invariants in rules.md, including the LLM content boundary:
      # no provider SDK outside the provider adapter, no Markdown prompt files, no prompt
      # instructing a model to emit a prohibited format, no empty package stubs, and the OpenAPI
      # contract's own parse and reference resolution.
      - name: Architecture tests
        run: make test-architecture

      # ANTI-VACUITY GATE. The suite has no environmental precondition, so every test must RUN.
      # If any test skips here, the reason is printed and the job fails.
      - name: Tests must not skip
        run: make test-no-skips

      # Exact counts on one line. That is what a reviewer needs, and finding it should not require
      # expanding a step and scrolling past a screen of progress dots.
      - name: Report test totals
        if: always()
        run: make test-summary

      - name: Coverage
        run: make coverage

  security:
    runs-on: ubuntu-latest
    env:
      # Pinned release, verified by checksum below. A moving tag would let the scanner change
      # under us without review.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      # SECURITY-INVARIANT: fetch-depth 0. A shallow clone cannot be scanned for secrets in
      # history, and the first CI run checked out with depth 1.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # Scans ALL REACHABLE COMMITS via --log-opts "--all --full-history", not the push event's
      # commit range. The previous configuration used that range, which on a first push resolved
      # to the nonexistent parent of the root commit; gitleaks errored having scanned ~0 bytes
      # and the job failed without ever inspecting the repository.
      #
      # --redact keeps any finding out of the log. --exit-code 1 makes a finding fail the job.
      - name: Secret scan - full git history
        run: |
          set -euo pipefail
          ./gitleaks git . \
            --log-opts="--all --full-history" \
            --redact \
            --no-banner \
            --exit-code 1

      # Second pass over the checked-out working tree. History and tree can differ, and a
      # tracked file is what an attacker actually reads.
      - name: Secret scan - working tree
        run: |
          set -euo pipefail
          ./gitleaks dir . \
            --redact \
            --no-banner \
            --exit-code 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Enforcing, not advisory. The previous `|| true` existed because `--strict` errors on
      # fintek itself, which is an editable local install and not on PyPI. --skip-editable is
      # the correct exclusion, so the gate can now fail the job on a real advisory instead of
      # swallowing every result.
      - name: Dependency vulnerability scan
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip pip-audit
          pip-audit --skip-editable
