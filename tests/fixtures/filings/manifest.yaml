# Source manifest for the committed filing fixtures.
#
# Every entry pins the accession, the SEC URL, and the SHA-256 of the object as
# retrieved. The extracted fixtures beside this file are derived from exactly these
# bytes. Re-fetch and compare with: python scripts/build_fixtures.py --verify
#
# WHAT IS COMMITTED, AND WHAT CHANGED IN SPRINT 4.1.
#
# Sprint 3 committed only derived fixtures — the FilingSummary, the report inventory, the
# table-ownership census — and no raw object, because at 8.4 MiB for four filings the
# payloads were large and SEC hosts them authoritatively.
#
# Sprint 4.1 commits the four PRIMARY DOCUMENTS as well, and nothing else. The reason is
# that complete-filing extraction cannot be regression-tested without the document body.
# The coverage ledger's whole purpose is to reconcile against the source material that was
# actually discovered; a ledger checked against a derived census would be checked against
# the extractor's own output, which is the vacuity trap this repository has already been
# bitten by twice — eighteen empty packages that made architecture tests pass while
# scanning nothing, and a migration range that reported green while generating no SQL.
#
# The cost is small: 3.9 MiB raw, roughly 264 KiB after git's zlib compression, against a
# 512 KiB pack. Every one of the four hashes below was verified byte-for-byte against the
# committed copy.
#
# Still NOT committed: the XBRL packages, extracted instances, and schemas. They are
# machine evidence, they are large, and no test reads them from the repository.
# They live in var/objects/, which is gitignored.
