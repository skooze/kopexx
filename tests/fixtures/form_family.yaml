# Reviewed SEC 10-K / 10-Q form-family inventory.
#
# DERIVED FROM AN EXHAUSTIVE SCAN of every time-eligible EDGAR quarterly master index,
# 1993Q1 through 2026Q3 -- 135 quarters, zero unavailable. The SEC had also pre-created a
# 2026Q4 directory whose index was a 236-byte header-only stub with zero data rows.
#
# THIS IS THE SOURCE OF TRUTH for which forms qualify. Qualifying logic is generated from
# this file, never from a hardcoded guess. A guessed allowlist searching for '10-KSB' and
# '10-QSB' could not match EDGAR's real strings '10KSB' and '10QSB', and so reported a
# family of roughly 190,000 filings as effectively absent.
#
# EXACT FILED STRINGS. Capitalisation, punctuation, spacing, hyphenation and amendment
# suffixes are preserved verbatim. Every identifier is QUOTED: YAML 1.2 parses an unquoted
# 0000320193 as the integer 320193 and destroys the leading zeros that make it a CIK.
#
# The full research corpus stays outside Git. This fixture is the durable summary.

scan:
  first_quarter: "1993Q1"
  last_time_eligible_quarter: "2026Q3"
  time_eligible_quarters_scanned: 135
  quarters_unavailable: 0
  pre_created_future_directory: "2026Q4"
  pre_created_future_directory_data_rows: 0
  distinct_ten_family_strings: 41

# Forms that plausibly LOOK like family members but do not occur in any scanned quarter.
# Recorded so a future guess cannot silently reintroduce them.
nonexistent_guessed_variants:
  - "10KSB405"
  - "10KSB405/A"

