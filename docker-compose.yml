# Local development stack.
#
# The model provider is the in-process mock by default, so nothing here reaches a model API and
# no credentials are required to run the system end to end.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fintek
      POSTGRES_PASSWORD: fintek
      POSTGRES_DB: fintek
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintek"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fintek
      MINIO_ROOT_PASSWORD: fintekfintek
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:
