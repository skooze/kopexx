  /benchmark/{cik}/{accession}/judgements:
    get:
      tags: [review]
      operationId: reviewBenchmarkJudgementsPage
      summary: Every human classification recorded for one filing, superseded versions included.
      description: |
        A truth document is superseded by a later version and BOTH are kept, so this page shows the
        version history rather than only the current document. A page that showed only the current
        one would make a revised judgement look like the only judgement there had ever been.

        THE READ VIEW EXISTS BECAUSE THE MENU POINTS AT IT. Before it, every navigation entry for
        judgements resolved to a POST-only path and would have answered 405.
      x-implementation-status: IMPLEMENTED
      x-phase: 2.3
      parameters:
        - $ref: "#/components/parameters/Cik"
        - $ref: "#/components/parameters/Accession"
      responses:
        "200":
          description: The recorded judgements, as HTML.
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [review]
      operationId: reviewRecordBenchmarkJudgement
      summary: Record one human classification of one inventory item, at a new truth version.
      description: |
        A FORM POST WITH A CSRF TOKEN, NEVER A LINK. Recording a judgement changes the denominator
        of a benchmark, and a link is something a browser can be made to follow.

        The request body is `application/x-www-form-urlencoded` and carries `kind` (`span`, `table`
        or `image`), `item_id`, `classification`, an optional `note`, and — for a span — the
        `member` and `start` the reviewer was reading, so the redirect returns them to the same
        window. Those two are NOT a redirect target: the location is built from the item kind, so
        nothing a browser sends can point the redirect off the origin.

        THE STORED DOCUMENT IS SUPERSEDED, NEVER OVERWRITTEN. The judgement lands at
        `version + 1` and every earlier version stays readable. A version already on disk is
        refused with 409 rather than replaced, so a lost update is reported instead of silent.

        A judgement about an item this filing's inventory does not contain has nothing to attach to
        and is refused with 404.
      x-implementation-status: IMPLEMENTED
      x-phase: 2.2
      parameters:
        - $ref: "#/components/parameters/Cik"
        - $ref: "#/components/parameters/Accession"
      responses:
        "201":
          description: The judgement, and the truth version it created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordedJudgement" }
        "303":
          description: A browser is redirected back to the page it recorded the judgement from.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            That benchmark-truth version is already stored. Reload the current version and record
            the judgement against it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

