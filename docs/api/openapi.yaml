# TWO CONTRACTS IN ONE FILE, AND THEY ARE NOT THE SAME KIND OF THING.
#
# PHASE 2 — THE PARSER-REVIEW APPLICATION — IS IMPLEMENTED AND RUNNING LOCALLY. Every operation
# marked `x-implementation-status: IMPLEMENTED` is served today by `packages/review_api`, and
# `tests/architecture/test_openapi_contract.py` compares this document against the application's
# own route table in BOTH directions: an operation marked IMPLEMENTED that no route serves fails
# the build, and a route the application serves that this document does not describe fails it too.
#
# THE BETA API IS STILL PLANNED. Every operation marked `x-implementation-status: PLANNED` records
# the SHAPE the beta is intended to take so the specifications, the UX and the data dictionary can
# agree with one another. It is redesigned as it is implemented in Phases 4 and 6.
#
# NO SERVER IS DECLARED, AND THAT IS DELIBERATE EVEN NOW. The review application binds to the
# loopback interface on a port the operator chooses; naming a URL here would turn a single-user
# development tool into a documented endpoint, and tooling would render a "try it" button for a
# host nobody else can reach.
#
# Authoritative direction: docs/adr/ADR-0016-corpus-first-model-first-architecture.md and
# roadmap.md. The product is an orchestrator-driven, model-first SEC filing product: the backend
# acquires, preserves, orchestrates and VALIDATES; a user-selected parsing model determines what a
# filing means. The user selects four models independently.
#
# THIS IS BROWSER-FACING JSON AND IS OUTSIDE THE LLM CONTENT BOUNDARY (ADR-0013). JSON is correct
# here; a browser is not a model. Model-visible synthetic content is unmarked plain text or exactly
# one unfenced YAML 1.2 document, and is never any payload defined in this file.
#
# NO CREDENTIAL APPEARS IN THIS API. The browser never calls Bedrock, never receives an AWS
# credential, and never learns a provider endpoint. All model access is server-side through
# packages/llm_gateway.
#
# NO RIGID FILING TAXONOMY. Parsed content is deliberately loosely typed: a node carries whatever
# label the filing and the parsing model produced. There is no enum of section kinds.
openapi: 3.1.0

info:
  title: Kopexx API — the parser-review application, and the architectural beta contract
  version: 0.1.0-phase2
  summary: The implemented parser-review surface, plus conceptual endpoints for the beta.
  description: |
    PARTLY IMPLEMENTED. Read the status on each operation and believe it rather than this summary.

    IMPLEMENTED — the Phase 2 parser-review application, served locally by `packages/review_api`
    over the standard library, bound to the loopback interface unless deliberately configured
    otherwise. These operations exist, are exercised by the test suite, and are compared against
    the application's real route table by an architecture test.

    PLANNED and NOT IMPLEMENTED — the beta API. No server serves any of it, no endpoint has been
    built, and every one of them carries the phase that will build it.

    Every operation carries `x-implementation-status`, and the only permitted values are
    `IMPLEMENTED` and `PLANNED`.

    Four independent model roles are selected by the user for every job: parsing, image, summary,
    and analysis/chat. No role inherits another's model, and there is no automatic substitution.

    The current authorized input mode is INTACT_SOURCE_ONLY. If the complete relevant human-readable
    source set does not fit the selected parsing model, that pairing is INCOMPATIBLE and the job is
    refused with an explanation. Nothing is truncated, sliced, projected, split, or silently
    swapped to another model.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

tags:
  - name: review
    description: |
      The IMPLEMENTED Phase 2 parser-review application. Parent runs, child filing jobs, exact
      request and response evidence, validation, review states and developer comments. The browser
      never receives a credential, a provider endpoint or a filesystem path, and there is no
      browser-to-provider route.
  - name: entities
    description: |
      The locally maintained catalog of entities with qualifying 10-K/10-Q-family filings. Backed
      by the MINIMUM BETA CATALOG delivered in Phase 3 and completed before Phase 6 — not by the
      Phase 8 universe-scale expansion, which widens the same catalog rather than creating it.
  - name: filings
    description: Discovered filings and their preserved original source artifacts.
  - name: models
    description: Dynamically discovered model catalog and the four role selections.
  - name: jobs
    description: Processing jobs, cost authorization, progress streaming.
  - name: artifacts
    description: Parsed, summary and image-analysis artifacts, each versioned and lineage-bearing.
  - name: chat
    description: Deep Dive sessions bound to an immutable scope.

paths:
  # ------------------------------------------------------------------------------------------
  # IMPLEMENTED — the Phase 2 parser-review application.
  #
  # Served by packages/review_api. HTML operations render the review UI; the /api operations
  # return browser-facing JSON, which is outside the LLM content boundary because a browser is
  # not a model (ADR-0013).
  # ------------------------------------------------------------------------------------------

  /health:
    get:
      tags: [review]
      operationId: reviewHealth
      summary: Liveness, bind mode, cost ceiling and cumulative spend.
      description: |
        Deliberately carries no account-specific material: no account identifier, no ARN, no
        profile name, no credential path. It reports the bind mode so an operator can tell a
        loopback instance from one on a network interface without guessing.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      responses:
        "200":
          description: The instance is serving.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewHealth" }

  /:
    get:
      tags: [review]
      operationId: reviewIndex
      summary: The review workspace, with the persistent left search panel.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      responses:
        "200":
          description: HTML.
          content:
            text/html:
              schema: { type: string }

  /sign-in:
    get:
      tags: [review]
      operationId: reviewSignInPage
      summary: The development sign-in form, used only when bound beyond loopback.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      responses:
        "200":
          description: HTML.
          content:
            text/html:
              schema: { type: string }
    post:
      tags: [review]
      operationId: reviewSignIn
      summary: Exchange the development secret for a server-side session.
      description: |
        The secret comes from ignored environment state and is never stored in this repository.
        The cookie carries an opaque session identifier and nothing else — no role, no claim, and
        nothing a client could forge.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      responses:
        "303":
          description: Signed in.
        "401":
          description: Refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /static/app.css:
    get:
      tags: [review]
      operationId: reviewStylesheet
      summary: The stylesheet, served from its own route so the content policy can forbid inline style.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      responses:
        "200":
          description: CSS.
          content:
            text/css:
              schema: { type: string }

  /static/app.js:
    get:
      tags: [review]
      operationId: reviewScript
      summary: The single script. It copies the run identifier and does nothing else.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      responses:
        "200":
          description: JavaScript.
          content:
            text/javascript:
              schema: { type: string }

  /api/models:
    get:
      tags: [review]
      operationId: reviewListModels
      summary: The four model selectors, each row carrying everything the UX specification requires.
      description: |
        Read from the reviewed capability snapshot, which is the only place identifiers, regions,
        modalities, limits and prices are written down. Unavailable candidates are RETURNED with a
        concrete reason rather than filtered away: a candidate that silently vanishes from a
        selector is indistinguishable from one that was never approved.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      responses:
        "200":
          description: Selector metadata for all four roles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelSelectors" }

  /api/entities:
    get:
      tags: [review]
      operationId: reviewSearchEntities
      summary: Typeahead over the local catalog of entities with qualifying filings.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Matches, ticker matches first.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogEntity" }

  /api/entities/{cik}:
    get:
      tags: [review]
      operationId: reviewGetEntity
      summary: One entity, with the filing-history bounds a timeframe control needs.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/Cik"
      responses:
        "200":
          description: The entity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogEntity" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/entities/{cik}/filings:
    get:
      tags: [review]
      operationId: reviewListEntityFilings
      summary: Preserved qualifying filings for one entity, newest first.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/Cik"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Filings.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogFiling" }

  /preflight:
    post:
      tags: [review]
      operationId: reviewPreflightPage
      summary: The cost-preflight page, shown before anything billable happens.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      responses:
        "200":
          description: HTML.
          content:
            text/html:
              schema: { type: string }
        "400":
          description: Refused, with the reason rendered.
          content:
            text/html:
              schema: { type: string }

  /api/preflight:
    post:
      tags: [review]
      operationId: reviewPreviewRunCost
      summary: Compatibility and a worst-case cost bound for every filing in a request.
      description: |
        Assembles each source set, checks it against the selected model under INTACT_SOURCE_ONLY,
        and bounds the cost. Nothing is invoked and nothing is charged. A filing whose complete
        source set does not fit is reported INCOMPATIBLE here with the measured bytes, the
        estimated tokens and the model's verified limit — it is not truncated, split or moved to a
        different model.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunRequest" }
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /runs:
    get:
      tags: [review]
      operationId: reviewRunsRedirect
      summary: Redirect to the run list, so a typed collection URL is not a bare 405.
      description: |
        `/runs` is a POST collection. A reader who typed it, or who read it off the anchored
        run-identifier bar, used to get a 405 with an Allow header and nothing else. It now
        redirects to the page that lists runs.
      x-implementation-status: IMPLEMENTED
      x-phase: 2.3
      responses:
        "303":
          description: See the run list at `/`.
    post:
      tags: [review]
      operationId: reviewCreateRun
      summary: Create one parent run and one child job per filing.
      description: |
        A multi-year request is never concatenated into one invocation. Only the parsing stage runs
        in this phase; selecting a summary or analysis model is refused rather than executed.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunRequest" }
      responses:
        "202":
          description: Accepted; child jobs are queued.
          content:
            application/json:
              schema:
                type: object
                required: [run_id, job_ids]
                properties:
                  run_id: { type: string }
                  job_ids:
                    type: array
                    items: { type: string }
        "303":
          description: A browser is redirected to the run page.
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/runs:
    get:
      tags: [review]
      operationId: reviewListRuns
      summary: Every stored evaluation run, newest first.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      responses:
        "200":
          description: Run summaries.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/RunSummary" }

  /runs/{run_id}:
    get:
      tags: [review]
      operationId: reviewRunPage
      summary: One parent run and its child filing jobs.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: HTML.
          content:
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/runs/{run_id}:
    get:
      tags: [review]
      operationId: reviewGetRun
      summary: The parent run manifest and every child job.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                type: object
                required: [run, summary, jobs]
                properties:
                  run: { type: object, additionalProperties: true }
                  summary: { $ref: "#/components/schemas/RunSummary" }
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/ChildJob" }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{run_id}/events:
    get:
      tags: [review]
      operationId: reviewStreamRunEvents
      summary: Server-sent progress events, resumable through Last-Event-ID.
      description: |
        Carries a kind, a child job identifier and a short message. No filing text and no provider
        payload crosses this stream: bodies live in the evaluation store and are referenced. The
        stream closes once every child job has reached a terminal state.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: An event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{run_id}/cancel:
    post:
      tags: [review]
      operationId: reviewCancelRun
      summary: Cancel every child job that has not yet been invoked.
      description: |
        A RUNNING job is not cancelled. The provider call is billable from the moment it is issued,
        and marking it cancelled would hide a charge the ledger still has to settle.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The jobs that were cancelled.
          content:
            application/json:
              schema:
                type: object
                required: [cancelled]
                properties:
                  cancelled:
                    type: array
                    items: { type: string }
        "303":
          description: A browser is redirected back to the run page.
        "404": { $ref: "#/components/responses/NotFound" }

  /api/runs/{run_id}/comments:
    get:
      tags: [review]
      operationId: reviewListComments
      summary: Every developer comment on one run, oldest first.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Comments.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/ReviewComment" }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{run_id}/jobs/{job_id}:
    get:
      tags: [review]
      operationId: reviewJobPage
      summary: "The review surface: raw, parsed, and side by side."
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ChildJobId"
        - name: view
          in: query
          schema: { type: string, enum: [raw, parsed, side-by-side], default: side-by-side }
        - name: artifact
          in: query
          schema: { type: string }
        - name: offset
          in: query
          description: A character offset in the preserved artifact, highlighted in the raw view.
          schema: { type: integer, minimum: 0 }
        - name: length
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: HTML.
          content:
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/runs/{run_id}/jobs/{job_id}:
    get:
      tags: [review]
      operationId: reviewGetChildJob
      summary: One child filing job, with its routing, costs, attempts and review history.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ChildJobId"
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChildJob" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/runs/{run_id}/jobs/{job_id}/source:
    get:
      tags: [review]
      operationId: reviewGetJobSourceArtifact
      summary: The exact preserved bytes of one submitted source artifact.
      description: |
        The bytes that were actually sent to the model, preserved with the run. Served as text and
        rendered escaped; nothing from a filing is ever parsed as markup by the browser.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ChildJobId"
        - name: artifact
          in: query
          schema: { type: string }
      responses:
        "200":
          description: The preserved artifact.
          content:
            text/plain:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/runs/{run_id}/jobs/{job_id}/response:
    get:
      tags: [review]
      operationId: reviewGetExactModelResponse
      summary: The exact bytes the model returned, before anything read them.
      description: |
        Authoritative whenever it and the parsed view could disagree. Preserved before validation
        runs, so a response that will not parse is still reviewable.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ChildJobId"
      responses:
        "200":
          description: The exact response.
          content:
            text/plain:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/runs/{run_id}/jobs/{job_id}/parsed:
    get:
      tags: [review]
      operationId: reviewGetParsedEvaluationArtifact
      summary: The parsed evaluation artifact, read elastically.
      description: |
        DELIBERATELY LOOSELY TYPED AND PROVISIONAL. A node carries whatever `type` and `title` the
        filing and the model produced. There is no enum of section kinds, no required hierarchy,
        and no obligation for any filing to use a particular vocabulary. Unknown keys are preserved
        rather than dropped.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ChildJobId"
      responses:
        "200":
          description: The parsed artifact, as the model shaped it.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The response is not readable as one YAML document; the exact bytes remain.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/runs/{run_id}/jobs/{job_id}/validation:
    get:
      tags: [review]
      operationId: reviewGetValidation
      summary: What the backend proved against the preserved bytes.
      description: |
        Coverage signals, resolved and unresolved source references, and generic numeric checks.
        `COMPLETE` is not a status this validator can issue.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ChildJobId"
      responses:
        "200":
          description: The validation record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationRecord" }
        "404": { $ref: "#/components/responses/NotFound" }

  /filings:
    get:
      tags: [review]
      operationId: reviewFilingsIndexPage
      summary: Every filing this instance holds evidence about.
      x-implementation-status: IMPLEMENTED
      x-phase: 2.3
      responses:
        "200":
          description: The filings index, as HTML.
          content:
            text/html:
              schema:
                type: string

  /runs/{run_id}/jobs/{job_id}/review:
    get:
      tags: [review]
      operationId: reviewParseHub
      summary: One parse, and every way of examining it, ending in the verdict form.
      description: |
        The landing page for judging one parse. It states what has been recorded and what has not,
        orders the evidence by what is cheapest and most decisive to check, and ends at the form
        that records a verdict.

        THE URL WHERE A VERDICT IS RECORDED IS THE URL WHERE IT IS DECIDED. The `post` below sets
        the review state on this same path.

        It carries NO coverage figure. Every one of them needs the source inventory and the anchor
        ladder over the preserved bytes, so showing one here would re-walk the filing on the
        landing page of every job. They stay on the model ledger page, which pays for them.
      x-implementation-status: IMPLEMENTED
      x-phase: 2.3
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ChildJobId"
      responses:
        "200":
          description: The parse hub, as HTML.
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [review]
      operationId: reviewSetReviewState
      summary: Move an artifact's review state, appending to its history.
      description: |
        Review state is independent of execution state and is never inferred from it. Approval
        records a judgement and activates nothing: no search consults the artifact, no cache is
        populated, and reuse remains disabled until roadmap.md Phase 4 authorizes it.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ChildJobId"
      responses:
        "200":
          description: The new review state.
          content:
            application/json:
              schema:
                type: object
                required: [review_state]
                properties:
                  review_state: { $ref: "#/components/schemas/ReviewStateValue" }
        "303":
          description: A browser is redirected back to the job page.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{run_id}/jobs/{job_id}/comments:
    post:
      tags: [review]
      operationId: reviewAddComment
      summary: Record one developer evaluation comment, bound to the artifact version.
      description: |
        Comments are DATA. They are displayed as text and are never placed into model-visible
        content.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ChildJobId"
      responses:
        "201":
          description: The stored comment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewComment" }
        "303":
          description: A browser is redirected back to the job page.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------------------------------------------
  # IMPLEMENTED — the model-directed multipart surface, added by Phase 2.1.
  #
  # A MULTIPART PARSE IS ONE CHILD JOB AND MANY CALLS. The child-job routes above still describe
  # the job; these describe the calls under it, the exact bytes each one sent and received, and the
  # MECHANICAL INDEX assembled from them. The thirty preserved single-response jobs have no tasks
  # and no assembly, and these routes report that plainly rather than failing.
  # ------------------------------------------------------------------------------------------
  /runs/{run_id}/jobs/{job_id}/multipart:
    get:
      tags: [review]
      operationId: reviewMultipartPage
      summary: The call hierarchy of one model-directed multipart parse.
      description: |
        Plan, parts, subparts, replanned branches, reconciliation and gap repairs, in the order the
        MODEL's own plan put them, each with its state, prompt version, output size, stop reason,
        cost and validation.
      x-implementation-status: IMPLEMENTED
      x-phase: 2.1
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ChildJobId"
      responses:
        "200":
          description: HTML.
          content:
            text/html:
