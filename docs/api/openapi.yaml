    get:
      tags: [review]
      operationId: reviewBenchmarkModelComparisonPage
      summary: Every run recorded against this filing, measured against one shared denominator.
      description: |
        One row per recorded run: the model, the region or inference profile, how the filing
        reached it, the execution, serialization and convergence states, visible spans covered,
        the SILENTLY OMITTED span count, structured tables emitted and resolved to a source
        element, table validations passing, cell texts found nowhere in the source, source members
