  # ------------------------------------------------------------------------------------------
  # IMPLEMENTED — the completeness benchmark surface, added by Phase 2.2.
  #
  # SCOPED TO A FILING AND NOT TO A RUN. Every operation below is keyed by (CIK, accession)
  # because a reviewer's classification of one filing's mechanical inventory is the DENOMINATOR
  # every parse of that filing is measured against. It outlives every run, it is what a second run
  # is compared with, and hanging it off whichever run happened to exist first would make a
  # benchmark's denominator depend on scheduling.
  #
  # NOTHING HERE INVOKES A MODEL OR SPENDS ANYTHING. The inventory is measured from preserved
  # bytes; the classification is a person's. No operation on this surface reaches a provider.
  # ------------------------------------------------------------------------------------------
  /benchmark/{cik}/{accession}:
    get:
      tags: [review]
      operationId: reviewBenchmarkPage
      summary: One filing's completeness benchmark — what was measured, and what has been classified.
      description: |
        Shows the mechanical totals, the benchmark-truth version, and the reviewed and unreviewed
        counts for spans, table elements and images.

        NO COMPLETENESS LEDGER IS SHOWN. A ledger measures ONE PARSE against this truth; no model
        has parsed the benchmark filing, so there is nothing to measure and nothing is displayed
        rather than a ledger computed against an absent parse.
      x-implementation-status: IMPLEMENTED
      x-phase: 2.2
      parameters:
        - $ref: "#/components/parameters/Cik"
        - $ref: "#/components/parameters/Accession"
