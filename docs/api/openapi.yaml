# TWO CONTRACTS IN ONE FILE, AND THEY ARE NOT THE SAME KIND OF THING.
#
# PHASE 2 — THE PARSER-REVIEW APPLICATION — IS IMPLEMENTED AND RUNNING LOCALLY. Every operation
# marked `x-implementation-status: IMPLEMENTED` is served today by `packages/review_api`, and
# `tests/architecture/test_openapi_contract.py` compares this document against the application's
# own route table in BOTH directions: an operation marked IMPLEMENTED that no route serves fails
# the build, and a route the application serves that this document does not describe fails it too.
#
# THE BETA API IS STILL PLANNED. Every operation marked `x-implementation-status: PLANNED` records
# the SHAPE the beta is intended to take so the specifications, the UX and the data dictionary can
# agree with one another. It is redesigned as it is implemented in Phases 4 and 6.
#
# NO SERVER IS DECLARED, AND THAT IS DELIBERATE EVEN NOW. The review application binds to the
# loopback interface on a port the operator chooses; naming a URL here would turn a single-user
# development tool into a documented endpoint, and tooling would render a "try it" button for a
# host nobody else can reach.
#
# Authoritative direction: docs/adr/ADR-0016-corpus-first-model-first-architecture.md and
# roadmap.md. The product is an orchestrator-driven, model-first SEC filing product: the backend
# acquires, preserves, orchestrates and VALIDATES; a user-selected parsing model determines what a
# filing means. The user selects four models independently.
#
# THIS IS BROWSER-FACING JSON AND IS OUTSIDE THE LLM CONTENT BOUNDARY (ADR-0013). JSON is correct
# here; a browser is not a model. Model-visible synthetic content is unmarked plain text or exactly
# one unfenced YAML 1.2 document, and is never any payload defined in this file.
#
# NO CREDENTIAL APPEARS IN THIS API. The browser never calls Bedrock, never receives an AWS
# credential, and never learns a provider endpoint. All model access is server-side through
# packages/llm_gateway.
#
# NO RIGID FILING TAXONOMY. Parsed content is deliberately loosely typed: a node carries whatever
# label the filing and the parsing model produced. There is no enum of section kinds.
openapi: 3.1.0

info:
  title: Kopexx API — the parser-review application, and the architectural beta contract
  version: 0.1.0-phase2
  summary: The implemented parser-review surface, plus conceptual endpoints for the beta.
  description: |
    PARTLY IMPLEMENTED. Read the status on each operation and believe it rather than this summary.

    IMPLEMENTED — the Phase 2 parser-review application, served locally by `packages/review_api`
    over the standard library, bound to the loopback interface unless deliberately configured
    otherwise. These operations exist, are exercised by the test suite, and are compared against
    the application's real route table by an architecture test.

    PLANNED and NOT IMPLEMENTED — the beta API. No server serves any of it, no endpoint has been
    built, and every one of them carries the phase that will build it.

    Every operation carries `x-implementation-status`, and the only permitted values are
    `IMPLEMENTED` and `PLANNED`.

    Four independent model roles are selected by the user for every job: parsing, image, summary,
    and analysis/chat. No role inherits another's model, and there is no automatic substitution.

    The current authorized input mode is INTACT_SOURCE_ONLY. If the complete relevant human-readable
    source set does not fit the selected parsing model, that pairing is INCOMPATIBLE and the job is
    refused with an explanation. Nothing is truncated, sliced, projected, split, or silently
    swapped to another model.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

tags:
  - name: review
    description: |
      The IMPLEMENTED Phase 2 parser-review application. Parent runs, child filing jobs, exact
      request and response evidence, validation, review states and developer comments. The browser
      never receives a credential, a provider endpoint or a filesystem path, and there is no
      browser-to-provider route.
  - name: entities
    description: |
      The locally maintained catalog of entities with qualifying 10-K/10-Q-family filings. Backed
      by the MINIMUM BETA CATALOG delivered in Phase 3 and completed before Phase 6 — not by the
      Phase 8 universe-scale expansion, which widens the same catalog rather than creating it.
  - name: filings
    description: Discovered filings and their preserved original source artifacts.
  - name: models
    description: Dynamically discovered model catalog and the four role selections.
  - name: jobs
    description: Processing jobs, cost authorization, progress streaming.
  - name: artifacts
    description: Parsed, summary and image-analysis artifacts, each versioned and lineage-bearing.
  - name: chat
    description: Deep Dive sessions bound to an immutable scope.

paths:
  # ------------------------------------------------------------------------------------------
  # IMPLEMENTED — the Phase 2 parser-review application.
  #
  # Served by packages/review_api. HTML operations render the review UI; the /api operations
  # return browser-facing JSON, which is outside the LLM content boundary because a browser is
  # not a model (ADR-0013).
  # ------------------------------------------------------------------------------------------

  /health:
    get:
      tags: [review]
      operationId: reviewHealth
      summary: Liveness, bind mode, cost ceiling and cumulative spend.
      description: |
        Deliberately carries no account-specific material: no account identifier, no ARN, no
        profile name, no credential path. It reports the bind mode so an operator can tell a
        loopback instance from one on a network interface without guessing.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      responses:
        "200":
          description: The instance is serving.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewHealth" }

  /:
    get:
      tags: [review]
      operationId: reviewIndex
      summary: The review workspace, with the persistent left search panel.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      responses:
        "200":
          description: HTML.
          content:
            text/html:
              schema: { type: string }

  /sign-in:
    get:
      tags: [review]
      operationId: reviewSignInPage
      summary: The development sign-in form, used only when bound beyond loopback.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      responses:
        "200":
          description: HTML.
          content:
            text/html:
              schema: { type: string }
    post:
      tags: [review]
      operationId: reviewSignIn
      summary: Exchange the development secret for a server-side session.
      description: |
        The secret comes from ignored environment state and is never stored in this repository.
        The cookie carries an opaque session identifier and nothing else — no role, no claim, and
        nothing a client could forge.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      responses:
        "303":
          description: Signed in.
        "401":
          description: Refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /static/app.css:
    get:
      tags: [review]
      operationId: reviewStylesheet
      summary: The stylesheet, served from its own route so the content policy can forbid inline style.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      responses:
        "200":
          description: CSS.
          content:
            text/css:
              schema: { type: string }

  /static/app.js:
    get:
      tags: [review]
      operationId: reviewScript
      summary: The single script. It copies the run identifier and does nothing else.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      responses:
        "200":
          description: JavaScript.
          content:
            text/javascript:
              schema: { type: string }

  /api/models:
    get:
      tags: [review]
      operationId: reviewListModels
      summary: The four model selectors, each row carrying everything the UX specification requires.
      description: |
        Read from the reviewed capability snapshot, which is the only place identifiers, regions,
        modalities, limits and prices are written down. Unavailable candidates are RETURNED with a
        concrete reason rather than filtered away: a candidate that silently vanishes from a
        selector is indistinguishable from one that was never approved.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      responses:
        "200":
          description: Selector metadata for all four roles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelSelectors" }

  /api/entities:
    get:
      tags: [review]
      operationId: reviewSearchEntities
      summary: Typeahead over the local catalog of entities with qualifying filings.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Matches, ticker matches first.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogEntity" }

  /api/entities/{cik}:
    get:
      tags: [review]
      operationId: reviewGetEntity
      summary: One entity, with the filing-history bounds a timeframe control needs.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/Cik"
      responses:
        "200":
          description: The entity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogEntity" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/entities/{cik}/filings:
    get:
      tags: [review]
      operationId: reviewListEntityFilings
      summary: Preserved qualifying filings for one entity, newest first.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/Cik"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Filings.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogFiling" }

  /preflight:
    post:
      tags: [review]
      operationId: reviewPreflightPage
      summary: The cost-preflight page, shown before anything billable happens.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      responses:
        "200":
          description: HTML.
          content:
            text/html:
              schema: { type: string }
        "400":
          description: Refused, with the reason rendered.
          content:
            text/html:
              schema: { type: string }

  /api/preflight:
    post:
      tags: [review]
      operationId: reviewPreviewRunCost
      summary: Compatibility and a worst-case cost bound for every filing in a request.
      description: |
        Assembles each source set, checks it against the selected model under INTACT_SOURCE_ONLY,
        and bounds the cost. Nothing is invoked and nothing is charged. A filing whose complete
        source set does not fit is reported INCOMPATIBLE here with the measured bytes, the
        estimated tokens and the model's verified limit — it is not truncated, split or moved to a
        different model.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunRequest" }
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /runs:
    post:
      tags: [review]
      operationId: reviewCreateRun
      summary: Create one parent run and one child job per filing.
      description: |
        A multi-year request is never concatenated into one invocation. Only the parsing stage runs
        in this phase; selecting a summary or analysis model is refused rather than executed.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunRequest" }
      responses:
        "202":
          description: Accepted; child jobs are queued.
          content:
            application/json:
              schema:
                type: object
                required: [run_id, job_ids]
                properties:
                  run_id: { type: string }
                  job_ids:
                    type: array
                    items: { type: string }
        "303":
          description: A browser is redirected to the run page.
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/runs:
    get:
      tags: [review]
      operationId: reviewListRuns
      summary: Every stored evaluation run, newest first.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      responses:
        "200":
          description: Run summaries.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/RunSummary" }

  /runs/{run_id}:
    get:
      tags: [review]
      operationId: reviewRunPage
      summary: One parent run and its child filing jobs.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: HTML.
          content:
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/runs/{run_id}:
    get:
      tags: [review]
      operationId: reviewGetRun
      summary: The parent run manifest and every child job.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                type: object
                required: [run, summary, jobs]
                properties:
                  run: { type: object, additionalProperties: true }
                  summary: { $ref: "#/components/schemas/RunSummary" }
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/ChildJob" }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{run_id}/events:
    get:
      tags: [review]
      operationId: reviewStreamRunEvents
      summary: Server-sent progress events, resumable through Last-Event-ID.
      description: |
        Carries a kind, a child job identifier and a short message. No filing text and no provider
        payload crosses this stream: bodies live in the evaluation store and are referenced. The
        stream closes once every child job has reached a terminal state.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: An event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{run_id}/cancel:
    post:
      tags: [review]
      operationId: reviewCancelRun
      summary: Cancel every child job that has not yet been invoked.
      description: |
        A RUNNING job is not cancelled. The provider call is billable from the moment it is issued,
        and marking it cancelled would hide a charge the ledger still has to settle.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The jobs that were cancelled.
          content:
            application/json:
              schema:
                type: object
                required: [cancelled]
                properties:
                  cancelled:
                    type: array
                    items: { type: string }
        "303":
          description: A browser is redirected back to the run page.
        "404": { $ref: "#/components/responses/NotFound" }

  /api/runs/{run_id}/comments:
    get:
      tags: [review]
      operationId: reviewListComments
      summary: Every developer comment on one run, oldest first.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Comments.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/ReviewComment" }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{run_id}/jobs/{job_id}:
    get:
      tags: [review]
      operationId: reviewJobPage
      summary: "The review surface: raw, parsed, and side by side."
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ChildJobId"
        - name: view
          in: query
          schema: { type: string, enum: [raw, parsed, side-by-side], default: side-by-side }
        - name: artifact
          in: query
          schema: { type: string }
        - name: offset
          in: query
          description: A character offset in the preserved artifact, highlighted in the raw view.
          schema: { type: integer, minimum: 0 }
        - name: length
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: HTML.
          content:
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/runs/{run_id}/jobs/{job_id}:
    get:
      tags: [review]
      operationId: reviewGetChildJob
      summary: One child filing job, with its routing, costs, attempts and review history.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ChildJobId"
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChildJob" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/runs/{run_id}/jobs/{job_id}/source:
    get:
      tags: [review]
      operationId: reviewGetJobSourceArtifact
      summary: The exact preserved bytes of one submitted source artifact.
      description: |
        The bytes that were actually sent to the model, preserved with the run. Served as text and
        rendered escaped; nothing from a filing is ever parsed as markup by the browser.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ChildJobId"
        - name: artifact
          in: query
          schema: { type: string }
      responses:
        "200":
          description: The preserved artifact.
          content:
            text/plain:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/runs/{run_id}/jobs/{job_id}/response:
    get:
      tags: [review]
      operationId: reviewGetExactModelResponse
      summary: The exact bytes the model returned, before anything read them.
      description: |
        Authoritative whenever it and the parsed view could disagree. Preserved before validation
        runs, so a response that will not parse is still reviewable.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ChildJobId"
      responses:
        "200":
          description: The exact response.
          content:
            text/plain:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/runs/{run_id}/jobs/{job_id}/parsed:
    get:
      tags: [review]
      operationId: reviewGetParsedEvaluationArtifact
      summary: The parsed evaluation artifact, read elastically.
      description: |
        DELIBERATELY LOOSELY TYPED AND PROVISIONAL. A node carries whatever `type` and `title` the
        filing and the model produced. There is no enum of section kinds, no required hierarchy,
        and no obligation for any filing to use a particular vocabulary. Unknown keys are preserved
        rather than dropped.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ChildJobId"
      responses:
        "200":
          description: The parsed artifact, as the model shaped it.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The response is not readable as one YAML document; the exact bytes remain.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/runs/{run_id}/jobs/{job_id}/validation:
    get:
      tags: [review]
      operationId: reviewGetValidation
      summary: What the backend proved against the preserved bytes.
      description: |
        Coverage signals, resolved and unresolved source references, and generic numeric checks.
        `COMPLETE` is not a status this validator can issue.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ChildJobId"
      responses:
        "200":
          description: The validation record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationRecord" }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{run_id}/jobs/{job_id}/review:
    post:
      tags: [review]
      operationId: reviewSetReviewState
      summary: Move an artifact's review state, appending to its history.
      description: |
        Review state is independent of execution state and is never inferred from it. Approval
        records a judgement and activates nothing: no search consults the artifact, no cache is
        populated, and reuse remains disabled until roadmap.md Phase 4 authorizes it.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ChildJobId"
      responses:
        "200":
          description: The new review state.
          content:
            application/json:
              schema:
                type: object
                required: [review_state]
                properties:
                  review_state: { $ref: "#/components/schemas/ReviewStateValue" }
        "303":
          description: A browser is redirected back to the job page.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{run_id}/jobs/{job_id}/comments:
    post:
      tags: [review]
      operationId: reviewAddComment
      summary: Record one developer evaluation comment, bound to the artifact version.
      description: |
        Comments are DATA. They are displayed as text and are never placed into model-visible
        content.
      x-implementation-status: IMPLEMENTED
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ChildJobId"
      responses:
        "201":
          description: The stored comment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewComment" }
        "303":
          description: A browser is redirected back to the job page.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------------------------------------------
  # IMPLEMENTED — the model-directed multipart surface, added by Phase 2.1.
  #
  # A MULTIPART PARSE IS ONE CHILD JOB AND MANY CALLS. The child-job routes above still describe
  # the job; these describe the calls under it, the exact bytes each one sent and received, and the
  # MECHANICAL INDEX assembled from them. The thirty preserved single-response jobs have no tasks
  # and no assembly, and these routes report that plainly rather than failing.
  # ------------------------------------------------------------------------------------------
  /runs/{run_id}/jobs/{job_id}/multipart:
    get:
      tags: [review]
      operationId: reviewMultipartPage
      summary: The call hierarchy of one model-directed multipart parse.
      description: |
        Plan, parts, subparts, replanned branches, reconciliation and gap repairs, in the order the
        MODEL's own plan put them, each with its state, prompt version, output size, stop reason,
        cost and validation.
      x-implementation-status: IMPLEMENTED
      x-phase: 2.1
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ChildJobId"
      responses:
        "200":
          description: HTML.
          content:
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{run_id}/jobs/{job_id}/assembled:
    get:
      tags: [review]
      operationId: reviewAssembledPage
      summary: The mechanically assembled parse, in the model's order and under the model's titles.
      description: |
        AN INDEX, NOT A REWRITTEN PARSE. Nothing is renamed, merged, moved or dropped; every part
        links back to the exact response that produced it.
      x-implementation-status: IMPLEMENTED
      x-phase: 2.1
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ChildJobId"
      responses:
        "200":
          description: HTML.
          content:
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{run_id}/jobs/{job_id}/tasks/{task_id}:
    get:
      tags: [review]
      operationId: reviewMultipartTaskPage
      summary: One call of a multipart parse, reviewed beside the preserved filing.
      x-implementation-status: IMPLEMENTED
      x-phase: 2.1
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ChildJobId"
        - $ref: "#/components/parameters/MultipartTaskId"
        - name: view
          in: query
          schema: { type: string, enum: [raw, parsed, side-by-side], default: side-by-side }
        - name: artifact
          in: query
          schema: { type: string }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0 }
        - name: length
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: HTML.
          content:
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/runs/{run_id}/jobs/{job_id}/tasks:
    get:
      tags: [review]
      operationId: reviewListMultipartTasks
      summary: Every queued call of one multipart parse, with a mechanical summary.
      x-implementation-status: IMPLEMENTED
      x-phase: 2.1
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ChildJobId"
      responses:
        "200":
          description: The tasks and their counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MultipartTaskList" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/runs/{run_id}/jobs/{job_id}/tasks/{task_id}:
    get:
      tags: [review]
      operationId: reviewGetMultipartTask
      summary: One call, with its routing, prompt, dependencies, attempts, cost and validation.
      x-implementation-status: IMPLEMENTED
      x-phase: 2.1
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ChildJobId"
        - $ref: "#/components/parameters/MultipartTaskId"
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MultipartTask" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/runs/{run_id}/jobs/{job_id}/tasks/{task_id}/request:
    get:
      tags: [review]
      operationId: reviewGetExactTaskRequest
      summary: The exact synthetic brief this call sent, as it was compiled.
      description: |
        The complete filing travelled beside it as preserved artifacts and is served by the
        job-scoped source route.
      x-implementation-status: IMPLEMENTED
      x-phase: 2.1
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ChildJobId"
        - $ref: "#/components/parameters/MultipartTaskId"
      responses:
        "200":
          description: The exact request brief.
          content:
            text/plain:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/runs/{run_id}/jobs/{job_id}/tasks/{task_id}/response:
    get:
      tags: [review]
      operationId: reviewGetExactTaskResponse
      summary: The exact bytes this call returned, preserved before anything read them.
      description: |
        Served for a TRUNCATED call too. A truncated attempt is evidence: it is preserved exactly,
        is never continued, and its partial content is not merged into the assembled parse.
      x-implementation-status: IMPLEMENTED
      x-phase: 2.1
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ChildJobId"
        - $ref: "#/components/parameters/MultipartTaskId"
      responses:
        "200":
          description: The exact response.
          content:
            text/plain:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/runs/{run_id}/jobs/{job_id}/assembly:
    get:
      tags: [review]
      operationId: reviewGetAssembledParse
      summary: The mechanical index over one filing's multipart parse.
      x-implementation-status: IMPLEMENTED
      x-phase: 2.1
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ChildJobId"
      responses:
        "200":
          description: The assembled index.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssembledParse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{run_id}/jobs/{job_id}/queue:
    post:
      tags: [review]
      operationId: reviewControlMultipartQueue
      summary: Resume, unblock, retry, cancel a branch, advance, or run reconciliation.
      description: |
        EVERY ACTION IS EXPLICIT AND MAY SPEND MONEY. There is no default action: an unrecognised
        one is refused rather than becoming the nearest thing that spends. A retry mints a new
        billable identity; a cancelled branch touches nothing already issued.
      x-implementation-status: IMPLEMENTED
      x-phase: 2.1
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ChildJobId"
      responses:
        "200":
          description: What the action did.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueActionResult" }
        "303":
          description: A browser is redirected back to the call hierarchy.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The action is not permitted from this state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ------------------------------------------------------------------------------------------
  # PLANNED — the beta API. None of the following is implemented.
  # ------------------------------------------------------------------------------------------
  /entities/search:
    get:
      tags: [entities]
      operationId: searchEntities
      summary: Typeahead over the local entity catalog.
      description: |
        Matches current name, former names, SEC filer name, current ticker, historical ticker, and
        alias. An entity with no qualifying filing never appears.

        CIK is identity. A ticker is a temporal alias and resolution is always as-of a date.
        Historical ticker observations appear only where authoritative evidence exists; none is
        fabricated.
      x-implementation-status: PLANNED
      x-phase: 6
      x-depends-on-phase: 3
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Ranked candidates.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/EntityMatch" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /entities/{cik}:
    get:
      tags: [entities]
      operationId: getEntity
      summary: One entity, with the filing-history bounds a timeframe selector needs.
      x-implementation-status: PLANNED
      x-phase: 6
      parameters:
        - $ref: "#/components/parameters/Cik"
      responses:
        "200":
          description: The entity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entity" }
        "404": { $ref: "#/components/responses/NotFound" }

  /entities/{cik}/filings:
    get:
      tags: [filings]
      operationId: listEntityFilings
      summary: Qualifying filings for an entity, optionally bounded by a timeframe.
      description: |
        Only forms in the reviewed 10-K/10-Q family appear. The exact filed form string is
        preserved verbatim; it is never normalized.
      x-implementation-status: PLANNED
      x-phase: 6
      parameters:
        - $ref: "#/components/parameters/Cik"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Filings in reverse chronological order.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/Filing" }
        "404": { $ref: "#/components/responses/NotFound" }

  /filings/{cik}/{accession}/source:
    get:
      tags: [filings]
      operationId: listSourceArtifacts
      summary: The preserved original SEC artifacts for one filing.
      description: |
        Original source is authoritative and is never replaced by a parse, a summary or a derived
        index. Each artifact records its SHA-256 and its provenance.

        Filing identity is (CIK, accession). The accession alone is not unique: co-registration
        puts one submission under more than one filer CIK.
      x-implementation-status: PLANNED
      x-phase: 3
      parameters:
        - $ref: "#/components/parameters/Cik"
        - $ref: "#/components/parameters/Accession"
      responses:
        "200":
          description: The preserved source set.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/SourceArtifact" }
        "404": { $ref: "#/components/responses/NotFound" }

  /models:
    get:
      tags: [models]
      operationId: listModels
      summary: The dynamically discovered model catalog.
      description: |
        DISCOVERED AT RUNTIME, never hardcoded. Identifiers, regions, modalities, context and
        output limits and prices are whatever live discovery returned, together with the time it
        was discovered. A model absent from discovery is not offered.

        No credential, endpoint or provider secret is exposed.
      x-implementation-status: PLANNED
      x-phase: 3
      responses:
        "200":
          description: Catalog snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [discovered_at, models]
                properties:
                  discovered_at: { type: string, format: date-time }
                  models:
                    type: array
                    items: { $ref: "#/components/schemas/ModelCapability" }

  /jobs/cost-preview:
    post:
      tags: [jobs]
      operationId: previewJobCost
      summary: Compatibility and estimated cost, before anything billable happens.
      description: |
        Returns per-role compatibility and an estimated cost. A pairing whose complete relevant
        human-readable source set does not fit the selected parsing model is reported INCOMPATIBLE
        here, with the measured bytes, the estimated tokens and the model's limit — the job is not
        silently downgraded.

        Token figures are ESTIMATES until measured against a provider tokenizer.
      x-implementation-status: PLANNED
      x-phase: 3
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobRequest" }
      responses:
        "200":
          description: Preview, including any incompatibility.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /jobs:
    post:
      tags: [jobs]
      operationId: createJob
      summary: Create a processing job. Requires explicit cost authorization.
      description: |
        A job is refused unless it carries an explicit authorization referencing a cost preview and
        an accepted ceiling. No billable invocation occurs without it.
      x-implementation-status: PLANNED
      x-phase: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/JobRequest"
                - type: object
                  required: [authorization]
                  properties:
                    authorization: { $ref: "#/components/schemas/CostAuthorization" }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "402": { $ref: "#/components/responses/BudgetExhausted" }
        "409": { $ref: "#/components/responses/Incompatible" }

  /jobs/{job_id}:
    get:
      tags: [jobs]
      operationId: getJob
      summary: Durable job state.
      x-implementation-status: PLANNED
      x-phase: 3
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/NotFound" }

  /jobs/{job_id}/events:
    get:
      tags: [jobs]
      operationId: streamJobEvents
      summary: Server-sent progress stream, resumable.
      description: |
        Resumption uses `Last-Event-ID`. A completed job is served from stored state and invokes no
        model; reconnecting after completion replays terminal state rather than re-running work.
      x-implementation-status: PLANNED
      x-phase: 3
      parameters:
        - $ref: "#/components/parameters/JobId"
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: An event stream of JobEvent objects.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/JobEvent" }
        "404": { $ref: "#/components/responses/NotFound" }

  /jobs/{job_id}/parsed:
    get:
      tags: [artifacts]
      operationId: getParsedArtifact
      summary: The accepted parsed artifact produced by the selected parsing model.
      description: |
        DELIBERATELY LOOSELY TYPED. A node carries whatever label the filing and the model
        produced. There is no enum of section kinds, no required hierarchy, and no obligation for
        any filing to use names like MD&A, Item 7, Part I, Footnote, Certification or Signature.
        Such names may appear as filing-native labels or model annotations; they are not ontology.

        Served from storage. No model call occurs.
      x-implementation-status: PLANNED
      x-phase: 3
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The parsed artifact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParsedArtifact" }
        "404": { $ref: "#/components/responses/NotFound" }

  /jobs/{job_id}/summary:
    get:
      tags: [artifacts]
      operationId: getSummaryArtifact
      summary: The summary artifact, separate from the parse it references.
      description: |
        A summary is its own artifact with its own version and lineage. Regenerating it does not
        require reparsing while the accepted parse is unchanged. Superseding the parse invalidates
        dependent summaries rather than silently leaving them attached.
      x-implementation-status: PLANNED
      x-phase: 5
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The summary artifact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SummaryArtifact" }
        "404": { $ref: "#/components/responses/NotFound" }

  /jobs/{job_id}/images:
    get:
      tags: [artifacts]
      operationId: listImageArtifacts
      summary: Image-analysis artifacts, when a separate image model was used.
      description: |
        Present only when the selected parsing model is text-only. A multimodal parsing model
        handles images itself and no image model is invoked redundantly, in which case this returns
        an empty list and records why.
      x-implementation-status: PLANNED
      x-phase: 4
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Image-analysis artifacts, and the reason none exist if none do.
          content:
            application/json:
              schema:
                type: object
                required: [artifacts]
                properties:
                  not_applicable_reason:
                    type: [string, "null"]
                    description: For example, the parsing model is multimodal and handled images itself.
                  artifacts:
                    type: array
                    items: { $ref: "#/components/schemas/ImageArtifact" }
        "404": { $ref: "#/components/responses/NotFound" }

  /chat/sessions:
    post:
      tags: [chat]
      operationId: createChatSession
      summary: Open a Deep Dive session bound to an immutable scope.
      description: |
        Scope — entity and timeframe — is fixed at creation and loaded server-side thereafter. The
        client sends a session id and a message and nothing else; it cannot widen scope.
      x-implementation-status: PLANNED
      x-phase: 7
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatSessionRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSession" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /chat/sessions/{session_id}/messages:
    post:
      tags: [chat]
      operationId: postChatMessage
      summary: Ask a question inside the session's scope.
      description: |
        Answers cite original evidence. A summary is never the sole evidence for a material claim.
        Every turn is checked against turn, token and cost budgets before invocation.
      x-implementation-status: PLANNED
      x-phase: 7
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1 }
      responses:
        "200":
          description: The answer and its citations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatTurn" }
        "402": { $ref: "#/components/responses/BudgetExhausted" }
        "403": { $ref: "#/components/responses/ScopeViolation" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      description: An opaque parent run identifier. Carries no account, issuer or model information.
      schema: { type: string, pattern: "^run_[a-z2-7]{26}$" }
    ChildJobId:
      name: job_id
      in: path
      required: true
      schema: { type: string, pattern: "^job_[a-z2-7]{26}$" }
    MultipartTaskId:
      name: task_id
      in: path
      required: true
      description: |
        A task identifier ISSUED BY THIS STORE. The part identifier a model chose is carried
        inside the record and never appears in a path.
      schema: { type: string, pattern: "^tsk_[a-z2-7]{26}$" }
    Cik:
      name: cik
      in: path
      required: true
      description: Ten-digit zero-padded CIK. Identity; never a ticker.
      schema: { type: string, pattern: "^[0-9]{10}$" }
    Accession:
      name: accession
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9]{10}-[0-9]{2}-[0-9]{6}$" }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Incompatible:
      description: |
        The complete relevant human-readable source set does not fit the selected model. The job is
        refused. Nothing is truncated and no other model is substituted.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Incompatibility" }
    BudgetExhausted:
      description: The cost ceiling for this job or session would be exceeded.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ScopeViolation:
      description: The request would leave the session's immutable scope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:

    MultipartTask:
      type: object
      description: |
        One queued call of a model-directed multipart parse. The model-created identifiers are
        carried VERBATIM under `model_created`; the storage token beside them is mechanically
        derived and is never an identity.
      additionalProperties: true
      properties:
        task_id: { type: string }
        run_id: { type: string }
        root_job_id: { type: string }
        parent_task_id: { type: [string, "null"] }
        task_type:
          type: string
          description: |
            PLAN_PARSE, PARSE_PART, PLAN_SUBPARTS, PARSE_SUBPART, REPLAN_TRUNCATED_PART,
            RECONCILE_PARSE, GAP_REPAIR, FORMAT_REPAIR, SOURCE_PREFLIGHT, VALIDATE_ASSEMBLY or
            READY_FOR_REVIEW.
        state:
          type: string
          description: |
            The queue state machine, which is separate from execution state and review state and is
            never derived from either.
        depth: { type: integer }
        order: { type: integer }
        model_created:
          type: object
          additionalProperties: true
          description: The plan, part and parent identifiers exactly as the model returned them.
        depends_on:
          type: array
          items: { type: string }
        dependency_policy: { type: string }
        idempotency:
          type: string
          description: |
            The billable identity of this call's inputs. Duplicate-schedule protection only; it
            makes no provider exactly-once claim.
        attempts:
          type: array
          items: { type: object, additionalProperties: true }
        truncation:
          type: [object, "null"]
          additionalProperties: true
          description: Present when the call reached the output limit. Evidence, never merged.
        validation:
          type: [object, "null"]
          additionalProperties: true

    MultipartTaskList:
      type: object
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/MultipartTask" }
        summary:
          type: object
          additionalProperties: true

    AssembledParse:
      type: object
      description: |
        A MECHANICAL INDEX over the exact model responses, built only from relations the model
        itself declared. No title is renamed, no content merged, no table moved and no part dropped.
        Its status is never COMPLETE: mechanical assembly, model-declared completion, source-
        reference coverage and human approval are four separate claims and none implies another.
      additionalProperties: true
      properties:
        status:
          type: string
          enum: [INCOMPLETE_WORK, RECONCILIATION_UNRESOLVED, MECHANICALLY_ASSEMBLED]
        mechanically_assembled: { type: boolean }
        model_declared_complete: { type: boolean }
        reconciliation_unresolved: { type: boolean }
        human_review_required: { type: boolean }
        plan:
          type: object
          additionalProperties: true
        parts:
          type: array
          items: { type: object, additionalProperties: true }
        tasks:
          type: array
          items: { type: object, additionalProperties: true }
        total_cost_usd: { type: string }
        validation:
          type: object
          additionalProperties: true

    QueueActionResult:
      type: object
      description: What an explicit queue action did. Every field is a list of task identifiers.
      additionalProperties: true

    ReviewHealth:
      type: object
      required: [status, bind_mode, cost_ceiling_usd, cumulative_spend_usd]
      description: |
        Deliberately carries nothing account-specific. No account identifier, no ARN, no profile
        name, no credential path, no provider endpoint.
      properties:
        status: { type: string }
        bind_mode: { type: string, enum: [loopback, network interface] }
        authentication_required: { type: boolean }
        https: { type: boolean }
        preferred_region: { type: string }
        catalog_entities: { type: [integer, "null"] }
        catalog_filings: { type: [integer, "null"] }
        cost_ceiling_usd: { type: string, description: An exact decimal carried as text. }
        cumulative_spend_usd: { type: string }
        max_concurrent_invocations: { type: integer, minimum: 1 }
        stages_executed_in_this_phase:
          type: array
          items: { type: string }

    ModelSelectorEntry:
      type: object
      required: [label, provider, region, badge, available]
      description: |
        One dropdown row. An unverified field renders as unverified, never as blank and never as a
        guess. A disabled row always carries a concrete reason.
      properties:
        label: { type: string }
        provider: { type: string }
        version: { type: string }
        region: { type: string }
        in_preferred_region: { type: boolean }
        inference_profile_id: { type: [string, "null"] }
        uses_inference_profile: { type: boolean }
        text_input: { type: boolean }
        image_input: { type: boolean }
        multimodal: { type: boolean }
        badge: { type: string, enum: [Multimodal, Text only] }
        context_tokens: { type: integer }
        max_output_tokens: { type: integer }
        available: { type: boolean }
        disabled_reason: { type: [string, "null"] }
        price_input_per_1k: { type: string }
        price_output_per_1k: { type: string }
        currency: { type: string }

    ModelSelectors:
      type: object
      required: [preferred_region, roles]
      description: |
        One entry per role. Only `parsing` is required; the other three carry an explicit blank
        option, which is a VISIBLE choice rather than a hidden default.
      properties:
        preferred_region: { type: string }
        roles:
          type: object
          additionalProperties:
            type: object
            required: [required, entries, executed_in_this_phase]
            properties:
              required: { type: boolean }
              executed_in_this_phase: { type: boolean }
              blank_option:
                type: [object, "null"]
                properties:
                  label: { type: string }
                  display: { type: string }
              entries:
                type: array
                items: { $ref: "#/components/schemas/ModelSelectorEntry" }

    CatalogEntity:
      type: object
      required: [cik, name, earliest_filing_date, latest_filing_date, filing_count]
      description: |
        NO FABRICATED IDENTITY. Tickers and former names come from what EDGAR returned; an issuer
        with none has none here, and no plausible reconstruction is substituted.
      properties:
        cik: { type: string, pattern: "^[0-9]{10}$" }
        name: { type: string }
        tickers:
          type: array
          items: { type: string }
        former_names:
          type: array
          items: { type: string }
        sic_description: { type: string }
        earliest_filing_date: { type: string, format: date }
        latest_filing_date: { type: string, format: date }
        filing_count: { type: integer, minimum: 1 }
        forms_present:
          type: array
          items: { type: string }

    CatalogFiling:
      type: object
      required: [cik, accession, form_as_filed, filing_date]
      properties:
        cik: { type: string, pattern: "^[0-9]{10}$" }
        accession: { type: string }
        form_as_filed:
          type: string
          description: The EXACT filed string, preserved verbatim and never normalized.
        filing_date: { type: string, format: date }
        report_period: { type: [string, "null"], format: date }
        issuer_label: { type: string }
        transport_era: { type: string }
        is_amendment: { type: boolean }
        is_annual: { type: boolean }
        form_variant: { type: string }
        package_file_count: { type: integer }
        package_image_count: { type: integer }
        primary_estimated_tokens:
          type: integer
          description: An ESTIMATE from a character ratio, never a provider tokenizer count.

    RunRequest:
      type: object
      required: [cik, parsing_label]
      description: |
        Only `parsing_label` is required. A blank image, summary or analysis label runs NO stage
        and never causes another role's model to be used.
      properties:
        cik: { type: string, pattern: "^[0-9]{10}$" }
        parsing_label: { type: string, minLength: 1 }
        image_label: { type: [string, "null"] }
        summary_label: { type: [string, "null"] }
        analysis_label: { type: [string, "null"] }
        accession: { type: [string, "null"] }
        from_date: { type: [string, "null"], format: date }
        to_date: { type: [string, "null"], format: date }

    RunPlan:
      type: object
      required: [routing, prompt, filings, worst_case_total_usd, ceiling_usd, within_ceiling]
      properties:
        routing: { type: object, additionalProperties: true }
        prompt: { type: object, additionalProperties: true }
        filings:
          type: array
          items: { type: object, additionalProperties: true }
        compatible_filings: { type: integer }
        incompatible_filings: { type: integer }
        worst_case_total_usd: { type: string }
        ceiling_usd: { type: string }
        already_spent_usd: { type: string }
        within_ceiling: { type: boolean }
        cost_note: { type: string }

    RunSummary:
      type: object
      required: [run_id, created_at, cik, job_count]
      properties:
        run_id: { type: string }
        created_at: { type: string, format: date-time }
        cik: { type: string }
        entity_label: { type: string }
        parsing_label: { type: string }
        selected_roles:
          type: array
          items: { type: string }
        job_count: { type: integer }
        ready_for_review: { type: integer }
        failed: { type: integer }
        incompatible: { type: integer }
        interrupted: { type: integer }
        actual_cost_usd: { type: string }

    ExecutionStateValue:
      type: string
      enum:
        [CREATED, SOURCE_READY, PREFLIGHT, QUEUED, RUNNING, RESPONSE_RECEIVED, VALIDATING,
         READY_FOR_REVIEW, FAILED, INCOMPATIBLE, INTERRUPTED, CANCELLED]

    ReviewStateValue:
      type: string
      description: |
        Independent of execution state and never inferred from it. APPROVED records a judgement and
        activates no reuse.
      enum: [EVALUATION, UNDER_REVIEW, APPROVED, REJECTED, SUPERSEDED, INVALIDATED]

    ChildJob:
      type: object
      required: [job_id, parent_run_id, filing, model_routing, execution_state, review_state]
      additionalProperties: true
      properties:
        job_id: { type: string }
        parent_run_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        filing: { $ref: "#/components/schemas/CatalogFiling" }
        model_routing: { type: object, additionalProperties: true }
        prompt: { type: object, additionalProperties: true }
        settings: { type: object, additionalProperties: true }
        execution_state: { $ref: "#/components/schemas/ExecutionStateValue" }
        review_state: { $ref: "#/components/schemas/ReviewStateValue" }
        source_set_id: { type: [string, "null"] }
        source_set: { type: [object, "null"], additionalProperties: true }
        validation: { type: [object, "null"], additionalProperties: true }
        image_coverage: { type: [object, "null"], additionalProperties: true }
        incompatibility: { type: [object, "null"], additionalProperties: true }
        attempts:
          type: array
          items: { type: object, additionalProperties: true }
        review_history:
          type: array
          items: { type: object, additionalProperties: true }
        reserved_cost_usd: { type: [string, "null"] }
        actual_cost_usd: { type: [string, "null"] }
        estimated_input_tokens: { type: [integer, "null"] }
        failure: { type: [string, "null"] }

    ValidationRecord:
      type: object
      required: [status, findings]
      additionalProperties: true
      description: |
        Coverage SIGNALS proved against the preserved bytes. `COMPLETE` is deliberately not a
        permitted status: nothing measured here establishes it.
      properties:
        status: { type: string, enum: [REVIEW_REQUIRED, PARTIAL, UNPARSEABLE, EMPTY] }
        status_note: { type: string }
        findings:
          type: array
          items: { type: string }
        node_count: { type: integer }
        table_count: { type: integer }
        reference_count: { type: integer }
        references_resolved: { type: integer }
        references_ambiguous: { type: integer }
        references_unresolved: { type: integer }
        artifacts_submitted: { type: integer }
        artifacts_referenced: { type: integer }
        model_selected_types:
          type: object
          additionalProperties: { type: integer }
        numeric: { type: object, additionalProperties: true }

    ReviewComment:
      type: object
      required: [comment_id, parent_run_id, target_type, target_id, author, created_at, text]
      properties:
        comment_id: { type: string }
        parent_run_id: { type: string }
        child_job_id: { type: [string, "null"] }
        target_type: { type: string }
        target_id: { type: string }
        target_version: { type: string }
        author: { type: string, description: A configured LABEL, never a personal identity. }
        created_at: { type: string, format: date-time }
        text: { type: string }
        status: { type: string }
        tags:
          type: array
          items: { type: string }

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        detail: { type: [string, "null"] }

    EntityMatch:
      type: object
      required: [cik, name, matched_on]
      properties:
        cik: { type: string, pattern: "^[0-9]{10}$" }
        name: { type: string, description: Authoritative current name, resolved from the CIK. }
        matched_on:
          type: string
          description: Which alias matched. A sampling label is never authoritative identity.
          enum: [current_name, former_name, filer_name, current_ticker, historical_ticker, alias]
        current_tickers:
          type: array
          items: { type: string }
          description: May be empty. Many issuers have no current ticker.

    Entity:
      type: object
      required:
        [cik, name, earliest_qualifying_filing, latest_qualifying_filing, qualifying_filing_count]
      properties:
        cik: { type: string, pattern: "^[0-9]{10}$" }
        name: { type: string }
        former_names:
          type: array
          items: { type: string }
        current_tickers:
          type: array
          items: { type: string }
        sic: { type: [string, "null"] }
        earliest_qualifying_filing:
          type: string
          format: date
          description: The lower bound of any selectable timeframe for this entity.
        latest_qualifying_filing: { type: string, format: date }
        qualifying_filing_count: { type: integer, minimum: 1 }

    Filing:
      type: object
      required: [cik, accession, form_as_filed, filing_date]
      properties:
        cik: { type: string, pattern: "^[0-9]{10}$" }
        accession: { type: string }
        form_as_filed:
          type: string
          description: |
            The EXACT filed string, preserved verbatim and never normalized. EDGAR writes 10KSB,
            not 10-KSB. Membership in the qualifying family comes from the reviewed inventory; an
            unreviewed form fails closed for review.
        filing_date: { type: string, format: date }
        report_period: { type: [string, "null"], format: date }
        is_amendment: { type: boolean }
        transport_era:
          type: string
          description: A transport observation, not a semantic classification.

    SourceArtifact:
      type: object
      required: [artifact_id, filename, sha256, size_bytes, role]
      properties:
        artifact_id: { type: string, format: uuid }
        filename: { type: string }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        size_bytes: { type: integer, minimum: 0 }
        declared_type:
          type: [string, "null"]
          description: The FILER's declared document type from the accession index table.
        media_type: { type: [string, "null"] }
        role:
          type: string
          enum: [primary_document, complete_submission, exhibit, image, other]
          description: A transport role, not a semantic one.
        separately_addressable:
          type: boolean
          description: |
            False for pre-2001 filings, where documents exist only inside the complete submission
            text file and EDGAR exposes no per-document URL.

    ModelRole:
      type: string
      enum: [parsing, image, summary, analysis]
      description: |
        Four roles, each selected independently by the user. No role inherits another's model and
        there is no automatic substitution or silent fallback.

    ModelCapability:
      type: object
      required: [model_id, roles_supported, discovered_at]
      properties:
        model_id: { type: string, description: As returned by live discovery. Never hardcoded. }
        display_name: { type: [string, "null"] }
        roles_supported:
          type: array
          items: { $ref: "#/components/schemas/ModelRole" }
        modalities:
          type: array
          items: { type: string, enum: [text, image] }
        context_tokens: { type: [integer, "null"] }
        max_output_tokens: { type: [integer, "null"] }
        discovered_at: { type: string, format: date-time }

    ModelSelections:
      type: object
      required: [parsing, summary, analysis]
      description: |
        The image selection may be omitted or null when the parsing model is multimodal; in that
        case the parsing model handles images and no image model is invoked.
      properties:
        parsing: { type: string }
        image: { type: [string, "null"] }
        summary: { type: string }
        analysis: { type: string }

    JobRequest:
      type: object
      required: [cik, accessions, models]
      properties:
        cik: { type: string, pattern: "^[0-9]{10}$" }
        accessions:
          type: array
          minItems: 1
          items: { type: string }
        models: { $ref: "#/components/schemas/ModelSelections" }

    Incompatibility:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [source_set_exceeds_context, modality_unsupported, model_unavailable]
        accession: { type: [string, "null"] }
        model_id: { type: [string, "null"] }
        source_set_bytes: { type: [integer, "null"] }
        estimated_input_tokens: { type: [integer, "null"] }
        model_context_tokens: { type: [integer, "null"] }
        alternatives:
          type: array
          description: Compatible models the USER may choose. The server never chooses for them.
          items: { type: string }

    CostPreview:
      type: object
      required: [compatible, per_filing]
      properties:
        compatible:
          type: boolean
          description: False if any filing/model pairing is incompatible.
        estimated_cost:
          type: [number, "null"]
          description: An ESTIMATE. No price is asserted before live discovery.
        currency: { type: [string, "null"] }
        per_filing:
          type: array
          items:
            type: object
            required: [accession, compatible]
            properties:
              accession: { type: string }
              compatible: { type: boolean }
              source_set_bytes: { type: [integer, "null"] }
              estimated_input_tokens:
                type: [integer, "null"]
                description: An estimate from a character ratio, not a provider tokenizer count.
              incompatibility: { $ref: "#/components/schemas/Incompatibility" }

    CostAuthorization:
      type: object
      required: [preview_id, accepted_ceiling]
      properties:
        preview_id: { type: string, format: uuid }
        accepted_ceiling: { type: number, minimum: 0 }
        currency: { type: string }

    CostRecord:
      type: object
      properties:
        input_tokens: { type: [integer, "null"] }
        output_tokens: { type: [integer, "null"] }
        amount: { type: [number, "null"] }
        currency: { type: [string, "null"] }
        latency_ms: { type: [integer, "null"] }
        measured:
          type: boolean
          description: False while any component is an estimate rather than a provider-reported value.

    Job:
      type: object
      required: [job_id, state, cik, accessions, models, created_at]
      properties:
        job_id: { type: string, format: uuid }
        state:
          type: string
          enum: [queued, acquiring, parsing, validating, summarizing, complete, failed, refused]
        cik: { type: string }
        accessions:
          type: array
          items: { type: string }
        models: { $ref: "#/components/schemas/ModelSelections" }
        created_at: { type: string, format: date-time }
        cost: { $ref: "#/components/schemas/CostRecord" }
        incompatibility: { $ref: "#/components/schemas/Incompatibility" }

    JobEvent:
      type: object
      required: [event_id, job_id, kind, at]
      properties:
        event_id: { type: string }
        job_id: { type: string, format: uuid }
        kind:
          type: string
          enum:
            [state_changed, progress, artifact_ready, validation_result, warning, error, terminal]
        at: { type: string, format: date-time }
        message: { type: [string, "null"] }

    ArtifactLineage:
      type: object
      required: [artifact_id, version, produced_by_model, prompt_version, created_at]
      properties:
        artifact_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        supersedes: { type: [string, "null"], format: uuid }
        produced_by_model: { type: string }
        prompt_version: { type: string }
        created_at: { type: string, format: date-time }
        request_uri:
          type: [string, "null"]
          description: Object-storage URI of the exact request body sent to the model.
        response_uri:
          type: [string, "null"]
          description: Object-storage URI of the exact response body received.

    SourceReference:
      type: object
      required: [artifact_id, start, end]
      description: A byte range in a preserved original artifact. Validation resolves it there.
      properties:
        artifact_id: { type: string, format: uuid }
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 0 }

    ParsedNode:
      type: object
      required: [node_id, order]
      description: |
        INTENTIONALLY OPEN. `label` is whatever the filing and the model produced — there is no
        enum, no required hierarchy and no universal taxonomy. Unrecognized structure is
        represented, not discarded.
      additionalProperties: true
      properties:
        node_id: { type: string }
        parent_id: { type: [string, "null"] }
        order: { type: integer, minimum: 0 }
        label:
          type: [string, "null"]
          description: Filing-native label or model annotation. Not a controlled vocabulary.
        content_type:
          type: [string, "null"]
          description: Open-ended, for example paragraph, list, table, image, heading.
        text: { type: [string, "null"] }
        source_references:
          type: array
          items: { $ref: "#/components/schemas/SourceReference" }
        confidence: { type: [number, "null"], minimum: 0, maximum: 1 }
        ambiguity: { type: [string, "null"] }
        unresolved:
          type: boolean
          default: false
          description: |
            An honest unresolved marker. It prevents a complete result; it never deletes content.
        is_financial_statement_footnote:
          type: boolean
          default: false
          description: |
            Set by the parsing model, not by backend code. Every node so marked remains an
            independent node and an independent required summary target.

    Coverage:
      type: object
      required: [status, source_bytes_total, source_bytes_represented]
      description: |
        Proved by the backend against the preserved bytes, never asserted by the model that
        produced the parse.
      properties:
        status:
          type: string
          enum: [COMPLETE, PARTIAL, REVIEW_REQUIRED]
        source_bytes_total: { type: integer, minimum: 0 }
        source_bytes_represented: { type: integer, minimum: 0 }
        unresolved_ranges:
          type: array
          items: { $ref: "#/components/schemas/SourceReference" }
        citations_checked: { type: integer, minimum: 0 }
        citations_resolved: { type: integer, minimum: 0 }
        numbers_checked: { type: integer, minimum: 0 }
        numbers_verbatim: { type: integer, minimum: 0 }

    ParsedArtifact:
      type: object
      required: [lineage, cik, accession, nodes, coverage]
      properties:
        lineage: { $ref: "#/components/schemas/ArtifactLineage" }
        cik: { type: string }
        accession: { type: string }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/ParsedNode" }
        coverage: { $ref: "#/components/schemas/Coverage" }

    SummaryArtifact:
      type: object
      required: [lineage, parses, sections]
      properties:
        lineage: { $ref: "#/components/schemas/ArtifactLineage" }
        parses:
          type: array
          description: The accepted parsed artifact versions this summary was grounded in.
          items: { type: string, format: uuid }
        invalidated_by_supersession:
          type: boolean
          default: false
        sections:
          type: array
          items:
            type: object
            required: [node_id, text]
            properties:
              node_id: { type: string }
              text: { type: string }
              source_references:
                type: array
                items: { $ref: "#/components/schemas/SourceReference" }

    ImageArtifact:
      type: object
      required: [lineage, source_artifact_id, description]
      properties:
        lineage: { $ref: "#/components/schemas/ArtifactLineage" }
        source_artifact_id: { type: string, format: uuid }
        located_in_document: { type: [string, "null"] }
        description: { type: string }

    ChatSessionRequest:
      type: object
      required: [cik, models]
      properties:
        cik: { type: string, pattern: "^[0-9]{10}$" }
        from: { type: [string, "null"], format: date }
        to: { type: [string, "null"], format: date }
        models: { $ref: "#/components/schemas/ModelSelections" }

    ChatSession:
      type: object
      required: [session_id, cik, created_at]
      properties:
        session_id: { type: string, format: uuid }
        cik: { type: string }
        from: { type: [string, "null"], format: date }
        to: { type: [string, "null"], format: date }
        analysis_model: { type: string }
        created_at: { type: string, format: date-time }

    ChatTurn:
      type: object
      required: [answer, citations, cost]
      properties:
        answer: { type: string }
        citations:
          type: array
          description: |
            Material claims cite original evidence. A summary is never the sole evidence for one.
          items:
            type: object
            required: [kind]
            properties:
              kind:
                type: string
                enum: [source, parsed_node, summary, numeric_fact]
              source_reference: { $ref: "#/components/schemas/SourceReference" }
              node_id: { type: [string, "null"] }
        cost: { $ref: "#/components/schemas/CostRecord" }
