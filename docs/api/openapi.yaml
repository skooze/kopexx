        of its fourteen conditions passed.

        NO RANKING, NO SORTING BY ANY COVERAGE FIGURE, NO AGGREGATE SCORE AND NO HIGHLIGHTED
        WINNER. Rows are ordered by when the run was created and by nothing else. `rules.md`
        section 21 rule 14 forbids selecting a parser, and a table ordered by a computed figure is
        that selection made for the reader.

        A run that failed at preflight or at the provider with zero parts is a row stating what
        happened. Its coverage columns are withheld rather than reported as zero, because zero in a
        coverage column is a measurement and a run that never answered has not made one.

        NOTHING HERE INVOKES A MODEL OR SPENDS ANYTHING. Every figure is computed from preserved
        bytes and preserved responses.
