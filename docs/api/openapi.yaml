    get:
      tags: [review]
      operationId: reviewBenchmarkInventoryPage
      summary: Every package member with its transport role, size, hash, span count and table count.
      description: |
        The transport role was decided from byte evidence by `packages/source_transport` and is not
        revisited. The SEC-declared type beside it is what the FILER typed into EDGAR's envelope:
        one is a measurement, the other is a claim, and they are displayed apart.
