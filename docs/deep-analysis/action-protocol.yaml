# Deep Analysis retrieval action protocol.
#
# IMPLEMENTATION STATUS: PLANNED (Phase 7). Nothing here is implemented and no store exists to
# retrieve from.
#
# UPDATED 2026-08-03 (ADR-0017). The operations were restated over the ACCEPTED PARSED ARTIFACT
# and the preserved original source. get_authorized_footnote became get_authorized_node, because
# a canonical footnote was a row of a deleted table and the backend no longer decides what a
# footnote is. get_authorized_fact and get_authorized_metric were REMOVED with the fact lake and
# derived metrics; numbers now come from the parse and are proved against the preserved bytes.
# Authoritative: docs/adr/ADR-0017-delete-the-rejected-parser-and-application-persistence.md
#
# Native model tool calling is prohibited (ADR-0013) because it requires JSON Schema tool
# definitions and produces JSON tool arguments. Retrieval is therefore either
# application-orchestrated, which is the default, or driven by this bounded YAML protocol.
#
# THE ENFORCEMENT RULE, which is what makes this safe:
#
#   The server IGNORES any cik, ticker, accession, node_id, or date range the model supplies for
#   the purpose of widening scope. Scope is loaded from the session record. A model-supplied
#   identifier is treated as a REQUEST TO SELECT FROM the authorized set, never as a request to
#   extend it. An identifier outside the allowlist is a logged scope violation.

protocol_version: "deep-analysis-actions-v1.0.0"

server_procedure:
  - parse the YAML response with the hardened safe parser
  - confirm response_type is retrieval_request
  - confirm operation is in the allowlist below
  - load scope from the session record, ignoring anything the model supplied
  - intersect any model-supplied identifiers with the authorized allowlist
  - clamp maximum_results to the server limit
  - execute the retrieval
  - record a retrieval_audit row
  - return a YAML evidence package
  - decrement retrieval_rounds_remaining

limits:
  maximum_retrieval_rounds_per_turn: 3
  maximum_results_per_operation: 20
  maximum_total_evidence_tokens: 60000
  maximum_excerpt_characters: 20000

operations:

  search_authorized_filings:
    description: Full-text and semantic search across authorized filings only.
    inputs:
      query: {type: string, required: true, max_length: 500}
      period_start: {type: date, required: false}
      period_end: {type: date, required: false}
      maximum_results: {type: integer, required: false, default: 8, server_max: 20}
    server_enforced:
      - cik is taken from the session, never from the request
      - accession filter is intersected with session.allowed_accessions
      - period filter is clamped to session.date_start and session.date_end
    outputs:
      matches:
        - node_id, accession, period_end, label, score, snippet
      # label is whatever the accepted parse called the node, or null. It is the parse's own
      # filing-native label, never a value from a backend taxonomy.
    errors:
      - SCOPE_VIOLATION      the request named an entity outside the session
      - LIMIT_EXCEEDED       retrieval rounds exhausted
    audit_fields: [session_id, operation, query, filter_set, candidate_count, selected_ids, scores, latency_ms]

  get_authorized_node:
    description: >-
      Retrieve one node of an accepted parsed artifact, with the source references it cites.
      A node is whatever the parsing model identified. The server does not interpret it.
    inputs:
      node_id: {type: string, required: true}
      include_children: {type: boolean, required: false, default: false}
      include_tables: {type: boolean, required: false, default: true}
    server_enforced:
      - node_id must resolve to a node of a parsed artifact whose filing is in
        session.allowed_accessions
      - when session.scope_type is NODE, node_id must be in session.allowed_node_ids
    outputs:
      node: {id, parent_id, order, label, content_type, accession, period_end}
      text: <the node text as the parse produced it>
      source_references: [{source_id, document, byte_start, byte_end, resolved}]
      tables: [{id, label, columns, rows}]
    errors: [SCOPE_VIOLATION, NOT_FOUND]

  get_authorized_table:
    description: Retrieve one table from an accepted parsed artifact, in structured form.
    inputs:
      table_id: {type: string, required: true}
    server_enforced:
      - the table's parsed artifact must be within session scope
    outputs:
      table: {id, label, unit, scale, columns, rows, period_labels, source_references}
      # unit and scale are carried only when the parse supplied them. The backend never infers a
      # unit from magnitude, and numeric cell text is the string the filer wrote.
    errors: [SCOPE_VIOLATION, NOT_FOUND]

  get_authorized_source_excerpt:
    description: Retrieve verbatim text from a preserved original source range.
    inputs:
      source_id: {type: string, required: true}
      max_characters: {type: integer, required: false, default: 8000, server_max: 20000}
    server_enforced:
      - the source range's filing must be in session.allowed_accessions
    outputs:
      source: {id, accession, document, byte_start, byte_end, text}
      # This is the only rung that returns filed bytes rather than a model product, which is why
      # a material claim must reach it.
    errors: [SCOPE_VIOLATION, NOT_FOUND]

prohibited_operations:
  # These do not exist and must never be added. Each would defeat the scope model.
  - search_all_edgar
  - fetch_any_ticker
  - search_web
  - execute_arbitrary_sql
  - retrieve_any_document
  - get_issuer_by_ticker

tests:
  # PLANNED. None of these exists yet.
  - test_tool_rejects_accession_outside_allowlist
  - test_tool_rejects_node_outside_node_scope
  - test_model_proposed_cik_is_ignored
  - test_maximum_results_is_clamped_server_side
  - test_retrieval_rounds_are_bounded
  - test_every_retrieval_writes_an_audit_row
  - test_no_retrieval_returns_foreign_cik
