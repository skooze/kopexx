    mapping_evidence: >-
      One model in the account is named gpt-oss-120b. GPT OSS Safeguard 120B
      (openai.gpt-oss-safeguard-120b) is a separately named and separately priced model and is NOT
      this label.
    availability: AVAILABLE
    access_status: agreement AVAILABLE, authorization AUTHORIZED, entitlement AVAILABLE
    first_use_enablement_required: false
    marketplace_subscription_required: false
    verified_regions: ["us-east-1"]
    inference_profile_required: false
    inference_profile_id: null
    text_input: true
    image_input: false
    multimodal: false
    image_verified: false
    context_tokens: 128000
    max_output_tokens: 16000
    invocation_apis: [Converse, InvokeModel, ChatCompletions, Responses]
    streaming_supported: true
    emits_reasoning_before_answer: true
    reasoning_evidence: >-
      Phase 2 measured reasoning content on 6 of 6 attempts, up to 14,980 characters. Phase 1
      measured the same behaviour at an 8-token cap, where the whole budget went to reasoning and
      the text block came back empty.
    price_input_per_1k: 0.00015
    price_output_per_1k: 0.0006
    price_image: none published; image input not supported
    smoke_transport: ACCEPTED
    smoke_instruction: NONCOMPLIANT
    smoke_note: >-
      Transport, authorization and request format all verified. The gate's mandatory 8-token
      output cap was consumed entirely by a reasoningContent block, so the text block came back
      empty with stopReason max_tokens. A separate one-off diagnostic at 64 output tokens returned
      reasoningContent followed by the text "hello", stopReason end_turn — exact compliance. This
      is a REQUEST-SIZING fact, not a capability defect.
    blocker: null
    disabled_reason: null
    compatibility_note: >-
      Emits reasoning content before answer text on the Converse path. max_output_tokens must be
      budgeted for reasoning PLUS the answer, or a caller receives a well-formed response with no
      text in it. Smallest documented context of the five, at 128K.

