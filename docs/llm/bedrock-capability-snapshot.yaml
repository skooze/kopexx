# Bedrock capability snapshot — the reviewed contract packages/model_catalog is SUPPLIED with.
#
# THIS FILE IS EVIDENCE, NOT A GUESS. Every value below was returned by a live AWS API or read from
# an official AWS model card on the stated date. Nothing here is inferred from a model's public
# reputation, and no value was carried forward from an earlier version of this repository, which
# had never reached a provider at all.
#
# IT IS DATED, AND IT IS NOT A PERMANENT CONSTANT. Bedrock adds models, moves them between regions,
# changes prices and retires versions. Re-run the discovery in docs/runbooks/bedrock-capability-
# discovery.md and replace this file wholesale; do not edit one field by hand and leave the rest
# claiming a date it no longer has.
#
# SUPPLIED, NEVER HARDCODED. This is the same rule the form-family contract established after a
# guessed allowlist in runtime source produced a confident, precise and inverted conclusion:
# packages/model_catalog carries NO model identifier, region, price or limit of its own. It is
# given this document and refuses to run without one.
#
# NO ACCOUNT-SPECIFIC MATERIAL. No account id, no SSO start URL, no profile name, no role session,
# no credential path. docs/security/aws-identity-and-secrets.md forbids account identifiers in
# tracked configuration and this repository is public. Where the account matters, the verification
# runbook says so and the value stays on the host.

# AMENDED 2026-08-03 BY PHASE 2.1. ONE FIELD WAS ADDED TO EVERY CANDIDATE AND NO EXISTING VALUE WAS
# CHANGED, SO THE PHASE 1 VERIFICATION DATE ABOVE REMAINS TRUE FOR EVERYTHING IT COVERS.
#
# The field is `emits_reasoning_before_answer`. Its evidence is not the Phase 1 discovery run; it is
# the Phase 2 benchmark of the same date, which recorded `reasoning_characters` separately from
# visible characters on all 30 preserved invocations. Counted across those records:
#
#     GPT OSS 120B                    6 of 6 attempts returned reasoning content, up to 14,980
#                                     characters, on filings of 23k to 41k input tokens
#     NVIDIA Nemotron 3 Super 120B    0 of 6
#     Qwen3 235B A22B                 0 of 6
#     Llama 4 Maverick                0 of 6
#     Qwen3 VL 235B                   0 of 6
#
# It is recorded here because model-directed multipart parsing has to size a per-part output target
# against the answer a model will actually have room for, and reasoning content spends the same
# allowance. Phase 1 already found this the hard way at 8 tokens; at part scale it is the difference
# between a part that finishes and a part that truncates. There is exactly one home for a model
# fact, and this is it.

snapshot_version: "2"
verified_on: "2026-08-03"
verified_from_region: "us-east-1"
verification_method: >-
  Live bedrock:ListFoundationModels, bedrock:GetFoundationModel,
  bedrock:GetFoundationModelAvailability, bedrock:ListInferenceProfiles and
  bedrock:GetInferenceProfile calls, plus one minimal bedrock-runtime:Converse invocation per
  accessible candidate, under a temporary IAM Identity Center role resolved by the AWS CLI
  provider chain. No static credential exists and none was created.

price_source: AWS Price List API, service code AmazonBedrock, on-demand standard service tier
price_effective_date: "2026-07-01"
price_currency: USD
price_unit: per 1000 tokens
price_note: >-
  Bedrock prices these candidates by token in both directions and publishes no separate image
  price; image input is billed as input tokens. Flex, priority and batch tiers carry different
  published rates and are NOT recorded here, because the only tier this project has authorized is
  standard on-demand. Recording a cheaper tier the code does not request would understate cost.

smoke_protocol:
  text_prompt: hello if you can read this please respond with hello only
  image_prompt: read the image and respond with hello only
  image_sha256: "54b47a3b0dbf2751d599c3019ab0339d009cf5aaf0a89004b5c2c9f1e7e679df"
  image_description: a 186x54 greyscale PNG, 173 bytes, showing only the word HELLO
  max_output_tokens: 8
  temperature: 0
  streaming: false
  system_prompt: none
  tools: none
  conversation_history: none
  note: >-
    The gate proves transport and authorization only — that the identity reaches Bedrock Runtime,
    that the identifier is valid, that the role may invoke it, that the request format is accepted
    and that a response returns. It is not a quality measurement and no SEC content was sent.

