metric_id: net_income
version: "1.0.0"
display_name: Net Income
description: >-
  Net income attributable to the parent entity. This is the investor-facing figure and is not
  interchangeable with ProfitLoss, which includes noncontrolling interests.
statement: income_statement
period_type: duration
allowed_duration_months: [3, 6, 9, 12]
allowed_units: [USD]
sign_normalization: as_reported
accepted_concepts:
  - taxonomy: us-gaap
    concept: NetIncomeLoss
    rank: 1
  - taxonomy: us-gaap
    concept: ProfitLoss
    rank: 2
    note: includes noncontrolling interest
  - taxonomy: us-gaap
    concept: IncomeLossFromContinuingOperations
    rank: 3
excluded_concepts:
  - us-gaap:NetIncomeLossAvailableToCommonStockholdersBasic
  - us-gaap:IncomeLossFromDiscontinuedOperationsNetOfTax
issuer_overrides: []
comparability_warnings:
  - condition: series_mixes_rank_1_and_rank_2
    message: >-
      This series mixes net income attributable to the parent with net income including
      noncontrolling interests. The two differ whenever a minority interest exists.
test_fixtures:
  - cik: "0000320193"
review_notes: >-
  Never blend rank 1 and rank 2 in one series without emitting the comparability warning.
