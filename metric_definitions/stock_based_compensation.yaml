metric_id: stock_based_compensation
version: "1.0.0"
display_name: Stock-Based Compensation
description: Total share-based compensation expense recognized in the period.
statement: cash_flow_statement
period_type: duration
allowed_duration_months: [3, 6, 9, 12]
allowed_units: [USD]
sign_normalization: as_reported

# Usually read from the cash-flow statement as a non-cash add-back, which is the most consistently
# tagged location across issuers. The income-statement allocation is frequently split across
# functional lines and does not sum reliably.
accepted_concepts:
  - taxonomy: us-gaap
    concept: ShareBasedCompensation
    rank: 1
  - taxonomy: us-gaap
    concept: AllocatedShareBasedCompensationExpense
    rank: 2
  - taxonomy: us-gaap
    concept: ShareBasedCompensationArrangementByShareBasedPaymentAwardCompensationCost
    rank: 3
excluded_concepts:
  - us-gaap:EmployeeServiceShareBasedCompensationNonvestedAwardsTotalCompensationCostNotYetRecognized
issuer_overrides: []
test_fixtures:
  - cik: "0000320193"
review_notes: >-
  Rank 2 is often reported per functional expense line with a dimensional qualifier. Only the
  consolidated (non-dimensional) fact is eligible.
