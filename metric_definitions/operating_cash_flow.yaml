metric_id: operating_cash_flow
version: "1.0.0"
display_name: Operating Cash Flow
description: Net cash provided by operating activities.
statement: cash_flow_statement
period_type: duration
allowed_duration_months: [3, 6, 9, 12]
allowed_units: [USD]
sign_normalization: as_reported

# FINANCIAL-INVARIANT: cash-flow facts are cumulative year-to-date. One Apple filing carries
# roughly 28 three-month, 28 six-month, 30 nine-month, and 48 twelve-month observations under the
# same concept. Charting them all produces a sawtooth of mixed durations. duration_months is
# mandatory on every observation and the chart must filter on it.
duration_filtering: mandatory

accepted_concepts:
  - taxonomy: us-gaap
    concept: NetCashProvidedByUsedInOperatingActivities
    rank: 1
  - taxonomy: us-gaap
    concept: NetCashProvidedByUsedInOperatingActivitiesContinuingOperations
    rank: 2
excluded_concepts:
  - us-gaap:NetCashProvidedByUsedInInvestingActivities
  - us-gaap:NetCashProvidedByUsedInFinancingActivities
issuer_overrides: []
test_fixtures:
  - cik: "0000320193"
review_notes: >-
  Rank 2 excludes discontinued operations. When an issuer reports both in the same period the
  values differ and the series must not silently switch between them mid-history.
