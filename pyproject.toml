[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fintek"
version = "0.1.0"
description = "Orchestrator-driven, model-first SEC filing acquisition, preservation and analysis"
requires-python = ">=3.12"
# EVERY ENTRY IS IMPORTED BY SURVIVING SOURCE. Verified by grep, not by memory.
#
#   ruamel.yaml   packages/llm_gateway/{yaml_parser,yaml_serializer}.py — the YAML 1.2 boundary
#   httpx         packages/sec_client/client.py — the only component that talks to SEC
#
# REMOVED WITH THE CODE THAT NEEDED THEM: sqlalchemy, alembic and psycopg[binary] existed for
# packages/persistence, migrations/ and packages/dera_notes. All three are deleted, no surviving
# module imports any of them, and no application database exists. They are not retained against a
# future persistence layer: that layer is designed from measured model artifacts, and whatever it
# needs is added when it is written.
#
# `pydantic` was declared and never imported by a single module. It went out with the audit.
dependencies = [
    "ruamel.yaml>=0.18",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

# Explicit package discovery. Automatic flat-layout discovery fails here because the repository
# root holds several non-Python top-level directories -- prompts, docs, tests -- and setuptools
# refuses to guess between them. It also picked up the gitignored var/ directory locally, which CI
# never saw, so the failure was not even reproducible across environments.
#
# THE INCLUDE PATTERN IS THE RULE, NOT A LIST AND NOT A COUNT. Everything under `packages/` ships;
# nothing else does. `packages/` is the only importable tree — it and every subpackage carry
# __init__.py, and every import in the codebase has the form `packages.<name>`. Adding a runtime
# package requires no edit here, and moving code out of `packages/` removes it from the
# distribution automatically. Do not write a package count or a name list into this comment: both
# go stale silently, and a stale count is what lets a deleted package keep appearing to exist.
#
# No package-data configuration is needed: packages/ contains zero non-.py files. Prompts are
# loaded from the repository by path, not as package resources.
[tool.setuptools.packages.find]
include = ["packages*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Verbosity is NOT set here. The Makefile is the single definition of how the suite is
# invoked, and a -q here combined with a -q there silently becomes -qq, which suppresses
# the "N passed, M skipped" line entirely — so `make test-summary` printed nothing.
addopts = "--strict-markers"
# `integration` was removed with tests/integration/. Every test in that directory exercised the
# deterministic parser or the DERA loader against a live PostgreSQL, and both are deleted. The
# marker is not kept in reserve: --strict-markers means an unused marker is a promise the suite
# does not keep, and the marker is re-added by whichever change writes the first integration test.
markers = [
    "architecture: enforces structural invariants from rules.md",
    "security: proves a security control",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
