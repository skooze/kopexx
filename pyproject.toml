[project]
name = "fintek"
version = "0.1.0"
description = "SEC filing ingestion, canonical footnote summarization, and scoped financial analysis"
requires-python = ">=3.12"
dependencies = [
    "ruamel.yaml>=0.18",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "integration: exercises more than one package together",
    "architecture: enforces structural invariants from rules.md",
    "security: proves a security control",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
